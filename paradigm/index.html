<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1118">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Impression">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<title>The Impression Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* ── Tokens ──────────────────────────────────────────────────────────────
   One committed visual world: a dark plate that ideas get struck into.
   Used at 5am and last thing at night, so dark-only is the choice, not an
   omission. Every colour is painted explicitly. */
:root{
  --ground:#0F1118; --plate:#181B24; --plate-hi:#1F2330; --recess:#0A0B10;
  --rule:#272C39; --rule-soft:#1D2130;
  --text:#E7E4DC; --text-dim:#9CA0AE; --text-faint:#6A6E7C;
  --copper:#C4854B; --copper-lit:#E0A868; --copper-deep:#7A5028;
  --patina:#6FB39A; --retreat:#7C7FA8;
  --shadow:0 1px 0 rgba(255,255,255,.045) inset, 0 2px 14px rgba(0,0,0,.5);
  --press:inset 0 2px 6px rgba(0,0,0,.75), inset 0 -1px 0 rgba(255,255,255,.05);
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --disp:"Archivo",var(--sans);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--ground);color:var(--text);font-family:var(--sans);
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(150px + env(safe-area-inset-bottom));
}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--copper-lit);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wrap{max-width:34rem;margin:0 auto;padding:0 1.15rem}
.screen{display:none;padding-top:1.5rem}
.screen.on{display:block}
.masthead{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;
  padding:1.4rem 0 1.1rem;border-bottom:1px solid var(--rule-soft);margin-bottom:1.5rem}
.masthead h1{margin:0;font-family:var(--disp);font-weight:800;font-stretch:118%;
  font-size:1.02rem;letter-spacing:.13em;text-transform:uppercase}
.masthead .daycount{font-family:var(--mono);font-size:.72rem;color:var(--copper);
  letter-spacing:.08em;white-space:nowrap}

h2.sec{font-family:var(--disp);font-weight:800;font-stretch:112%;font-size:1.32rem;
  letter-spacing:-.005em;margin:0 0 .35rem;text-wrap:balance}
h3.sub{font-family:var(--disp);font-weight:700;font-stretch:106%;font-size:1.05rem;margin:0 0 .3rem}
.eyebrow{font-family:var(--mono);font-size:.68rem;letter-spacing:.17em;text-transform:uppercase;
  color:var(--copper);margin:0 0 .5rem}
.eyebrow.dim{color:var(--text-faint)}
p.lede{color:var(--text-dim);margin:0 0 1.15rem;font-size:.94rem;max-width:34em}
p.note{color:var(--text-faint);font-size:.82rem;margin:.5rem 0 0;line-height:1.5}
.src{font-family:var(--mono);font-size:.66rem;letter-spacing:.06em;color:var(--text-faint);text-transform:uppercase}
em.cite{font-style:normal;font-family:var(--mono);font-size:.7rem;color:var(--copper);letter-spacing:.04em}

.plate{background:var(--plate);border:1px solid var(--rule-soft);border-radius:3px;
  box-shadow:var(--shadow);padding:1.15rem;margin-bottom:1rem}
.plate.tight{padding:.9rem 1rem}
.plate.flag{border-color:var(--copper-deep);background:rgba(196,133,75,.06)}
.plate-head{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:.75rem}
.row{display:flex;gap:.6rem;align-items:center}
.row.wrap{flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:baseline;gap:1rem}

.statement{background:var(--recess);border:1px solid var(--rule);border-radius:3px;
  box-shadow:var(--press);padding:1.35rem 1.2rem}
.statement .txt{font-family:var(--disp);font-weight:700;font-stretch:104%;font-size:1.28rem;
  line-height:1.32;letter-spacing:-.012em;color:var(--text);text-wrap:balance;margin:0;
  text-shadow:0 1px 0 rgba(0,0,0,.85)}
.statement.big .txt{font-size:1.58rem;font-weight:800}
.statement .tag{font-family:var(--mono);font-size:.63rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--copper);display:block;margin-bottom:.55rem}

.tally{display:flex;flex-wrap:wrap;gap:.42rem;align-items:center;min-height:34px}
.strike{width:11px;height:32px;border-radius:1.5px;background:var(--recess);
  box-shadow:var(--press);border:1px solid var(--rule-soft)}
.strike.hit{background:linear-gradient(180deg,var(--copper-lit),var(--copper-deep));
  border-color:var(--copper-deep);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 0 10px rgba(196,133,75,.22)}
.strike.fresh{animation:press .34s cubic-bezier(.3,1.4,.5,1)}
@keyframes press{0%{transform:scaleY(1.5) translateY(-4px);opacity:.3}60%{transform:scaleY(.9)}100%{transform:none;opacity:1}}
.tally-meta{font-family:var(--mono);font-size:.72rem;color:var(--text-dim);letter-spacing:.05em;
  font-variant-numeric:tabular-nums}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  background:var(--plate-hi);color:var(--text);border:1px solid var(--rule);border-radius:3px;
  padding:.72rem 1.05rem;cursor:pointer;font-family:var(--mono);font-size:.76rem;
  letter-spacing:.11em;text-transform:uppercase;
  transition:background .14s ease,border-color .14s ease,transform .06s ease}
.btn:hover{background:#242938}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,var(--copper),#A96C36);
  border-color:var(--copper-deep);color:#140D06;font-weight:500}
.btn.primary:hover{background:linear-gradient(180deg,var(--copper-lit),var(--copper))}
.btn.wide{width:100%}
.btn.ghost{background:transparent;border-color:var(--rule-soft);color:var(--text-dim)}
.btn.ghost:hover{color:var(--text);border-color:var(--rule)}
.btn.sm{padding:.5rem .75rem;font-size:.68rem}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.done{background:transparent;border-color:var(--copper-deep);color:var(--copper);cursor:default}
.btn.done:hover{background:transparent}

label.fld{display:block;margin-bottom:1rem}
label.fld > span{display:block;font-family:var(--mono);font-size:.68rem;letter-spacing:.13em;
  text-transform:uppercase;color:var(--text-dim);margin-bottom:.4rem}
input[type=text],input[type=date],input[type=number],textarea,select{
  width:100%;background:var(--recess);border:1px solid var(--rule);border-radius:3px;
  padding:.7rem .8rem;font-size:.95rem;box-shadow:var(--press)}
textarea{resize:vertical;min-height:5.5rem;line-height:1.5}
input::placeholder,textarea::placeholder{color:var(--text-faint)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.9rem}
.chip{background:var(--recess);border:1px solid var(--rule);color:var(--text-dim);
  border-radius:100px;padding:.35rem .7rem;font-size:.8rem;cursor:pointer;text-align:left}
.chip:hover{color:var(--text);border-color:var(--copper-deep)}
.chip.on{background:var(--copper-deep);border-color:var(--copper);color:var(--text)}

.checks{list-style:none;margin:.6rem 0 0;padding:0;display:flex;flex-direction:column;gap:.4rem}
.checks li{font-size:.82rem;color:var(--retreat);line-height:1.45;padding-left:1rem;position:relative}
.checks li::before{content:"";position:absolute;left:0;top:.55em;width:6px;height:1px;background:var(--retreat)}
.checks li.ok{color:var(--patina)}
.checks li.ok::before{background:var(--patina)}

.rail{display:flex;gap:3px;margin-bottom:1.4rem}
.rail i{flex:1;height:2px;background:var(--rule-soft);border-radius:1px}
.rail i.on{background:var(--copper)}

.task{display:flex;gap:.8rem;align-items:flex-start;padding:.85rem 0;border-bottom:1px solid var(--rule-soft)}
.task:last-child{border-bottom:0;padding-bottom:0}
.task:first-of-type{padding-top:0}
.tick{flex:0 0 22px;width:22px;height:22px;margin-top:.1rem;border-radius:2px;background:var(--recess);
  border:1px solid var(--rule);box-shadow:var(--press);cursor:pointer;display:grid;place-items:center;padding:0}
span.tick{cursor:default}
.tick svg{width:13px;height:13px;stroke:var(--copper-lit);stroke-width:2.4;fill:none;opacity:0;
  stroke-linecap:round;stroke-linejoin:round}
.tick.on{background:var(--copper-deep);border-color:var(--copper)}
.tick.on svg{opacity:1}
.task-body{flex:1;min-width:0}
.task-title{font-size:.94rem;line-height:1.4}
.task-title.struck{color:var(--text-faint);text-decoration:line-through;text-decoration-color:var(--copper-deep)}
.task-sub{font-size:.8rem;color:var(--text-faint);margin-top:.15rem;line-height:1.45}

/* ── Overlays: session, instant, roots ─────────────────────────────────── */
.overlay{position:fixed;inset:0;background:var(--ground);z-index:60;display:none;
  flex-direction:column;padding:1.4rem;padding-bottom:calc(1.4rem + env(safe-area-inset-bottom));
  overflow-y:auto}
.overlay.on{display:flex;animation:rise .22s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.overlay-inner{max-width:34rem;margin:auto;width:100%;display:flex;flex-direction:column;gap:1.2rem}
.angle{font-family:var(--disp);font-weight:900;font-stretch:125%;font-size:2.1rem;letter-spacing:.02em;
  text-transform:uppercase;color:var(--copper);margin:0;line-height:1}
.instruct{color:var(--text-dim);font-size:.95rem;margin:0;max-width:34em}
.ring{display:block;margin:0 auto}
.ring circle{fill:none;stroke-width:3}
.ring .track{stroke:var(--rule)}
.ring .prog{stroke:var(--copper);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.ring-num{font-family:var(--mono);font-size:1.1rem;fill:var(--text);text-anchor:middle;
  font-variant-numeric:tabular-nums}

/* Breath pacer: a disc that swells on the two inhales and empties on the exhale. */
.breath{display:grid;place-items:center;height:210px;position:relative}
.breath .disc{width:70px;height:70px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,var(--copper-lit),var(--copper-deep));
  box-shadow:0 0 40px rgba(196,133,75,.28);transition:transform 1s linear}
.breath .cue{position:absolute;bottom:6px;left:0;right:0;text-align:center;
  font-family:var(--mono);font-size:.78rem;letter-spacing:.13em;text-transform:uppercase;color:var(--copper)}
.breath .cnt{position:absolute;top:4px;left:0;right:0;text-align:center;
  font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;color:var(--text-faint)}

.scale{display:flex;gap:.3rem}
.scale button{flex:1;padding:.6rem .1rem;background:var(--recess);border:1px solid var(--rule);
  border-radius:2px;cursor:pointer;font-family:var(--mono);font-size:.78rem;color:var(--text-dim);
  box-shadow:var(--press)}
.scale button:hover{border-color:var(--copper-deep);color:var(--text)}
.scale button.on{background:var(--copper-deep);border-color:var(--copper);color:var(--text)}
.scale-ends{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.63rem;
  color:var(--text-faint);letter-spacing:.07em;margin-top:.35rem}

.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:.7rem}
.metric{background:var(--plate);border:1px solid var(--rule-soft);border-radius:3px;
  padding:.85rem .9rem;box-shadow:var(--shadow)}
.metric .k{font-family:var(--mono);font-size:.63rem;letter-spacing:.13em;text-transform:uppercase;
  color:var(--text-faint);display:block;margin-bottom:.3rem}
.metric .v{font-family:var(--disp);font-weight:800;font-stretch:110%;font-size:1.75rem;line-height:1;
  font-variant-numeric:tabular-nums}
.metric .v small{font-family:var(--mono);font-size:.72rem;font-weight:400;color:var(--text-faint);letter-spacing:.04em}
.metric.pat .v{color:var(--patina)}
.metric.ret .v{color:var(--retreat)}
.metric.cop .v{color:var(--copper)}

.gauge{height:10px;background:var(--recess);border:1px solid var(--rule);border-radius:2px;
  box-shadow:var(--press);overflow:hidden}
.gauge i{display:block;height:100%;background:linear-gradient(90deg,var(--copper-deep),var(--copper-lit));
  transition:width .5s ease}
.gauge.thin{height:6px}
.axis{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.65rem;
  color:var(--text-faint);margin-top:.35rem;letter-spacing:.06em}

.chart{width:100%;height:110px;display:block}
.chart .grid{stroke:var(--rule-soft);stroke-width:1}
.chart .line{fill:none;stroke:var(--copper);stroke-width:2;stroke-linejoin:miter}
.chart .cap{fill:var(--copper-lit)}

.entry{border-left:2px solid var(--rule);padding:.15rem 0 .15rem .85rem;margin-bottom:1rem}
.entry.through{border-left-color:var(--patina)}
.entry.back{border-left-color:var(--retreat)}
.entry.evi{border-left-color:var(--copper)}
.entry .when{font-family:var(--mono);font-size:.66rem;color:var(--text-faint);letter-spacing:.08em;
  text-transform:uppercase}
.entry p{margin:.2rem 0 0;font-size:.9rem;line-height:1.5}
.empty{color:var(--text-faint);font-size:.87rem;font-style:italic}

.card{border-top:1px solid var(--rule-soft);padding:1.05rem 0}
.card:first-of-type{border-top:0;padding-top:.2rem}
.card h3{font-family:var(--disp);font-weight:700;font-stretch:108%;font-size:1.02rem;margin:0 0 .35rem}
.card p{margin:0 0 .5rem;font-size:.89rem;color:var(--text-dim);line-height:1.55}
.card .apply{font-size:.85rem;color:var(--text);border-left:2px solid var(--copper-deep);padding-left:.7rem}
.grouphead{font-family:var(--mono);font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--copper);margin:2rem 0 .2rem;padding-bottom:.4rem;border-bottom:1px solid var(--rule)}
.grouphead:first-child{margin-top:0}

.banner{border:1px solid var(--copper-deep);background:rgba(196,133,75,.07);border-radius:3px;
  padding:.85rem 1rem;margin-bottom:1rem}
.banner p{margin:0;font-size:.87rem;line-height:1.5;color:var(--text)}
.banner .eyebrow{margin-bottom:.3rem}

.shiftrow{display:flex;gap:.8rem;align-items:flex-start;padding:.9rem 0;border-bottom:1px solid var(--rule-soft)}
.shiftrow:last-child{border-bottom:0}
.shiftrow .dot{flex:0 0 9px;width:9px;height:9px;border-radius:50%;margin-top:.45rem;
  background:var(--rule);box-shadow:var(--press)}
.shiftrow.active .dot{background:var(--copper);box-shadow:0 0 10px rgba(196,133,75,.5)}
.shiftrow .nm{font-size:.95rem;line-height:1.35}
.shiftrow .meta{font-family:var(--mono);font-size:.66rem;color:var(--text-faint);letter-spacing:.06em;
  text-transform:uppercase;margin-top:.2rem}

/* ── Dock: the always-there instant button, then the tabs ──────────────── */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;padding-bottom:env(safe-area-inset-bottom);
  background:linear-gradient(180deg,rgba(15,17,24,0),rgba(15,17,24,.96) 22%)}
.dock-inner{max-width:34rem;margin:0 auto;padding:0 1.15rem}
.instant-btn{width:100%;margin-bottom:.55rem;padding:.95rem;border-radius:3px;cursor:pointer;
  background:linear-gradient(180deg,var(--copper),#A96C36);border:1px solid var(--copper-deep);
  color:#140D06;font-family:var(--disp);font-weight:900;font-stretch:120%;font-size:.95rem;
  letter-spacing:.14em;text-transform:uppercase;
  box-shadow:0 4px 22px rgba(196,133,75,.26),inset 0 1px 0 rgba(255,255,255,.3)}
.instant-btn:active{transform:translateY(1px)}
.tabs{border-top:1px solid var(--rule);background:rgba(15,17,24,.96);backdrop-filter:blur(12px);
  margin:0 -1.15rem}
.tabs-inner{display:grid;grid-template-columns:repeat(5,1fr);max-width:34rem;margin:0 auto}
.tab{background:none;border:0;padding:.65rem .2rem .75rem;cursor:pointer;display:flex;
  flex-direction:column;align-items:center;gap:.26rem;color:var(--text-faint)}
.tab svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.tab span{font-family:var(--mono);font-size:.58rem;letter-spacing:.07em;text-transform:uppercase}
.tab.on{color:var(--copper)}

.hidden{display:none!important}
</style>
</head>
<body>

<!-- ══ OVERLAY: instant shift, and the money-roots flow reuses it ═══════ -->
<div class="overlay" id="instant" role="dialog" aria-modal="true" aria-labelledby="i-title">
  <div class="overlay-inner">
    <div class="spread">
      <p class="eyebrow dim" id="i-step">Instant shift</p>
      <button class="btn ghost sm" id="i-close" type="button">Leave</button>
    </div>
    <h2 class="angle" id="i-title">Locate</h2>
    <p class="instruct" id="i-tell"></p>
    <div id="i-stage"></div>
    <button class="btn primary wide" id="i-next" type="button">Continue</button>
    <p class="note" id="i-cite"></p>
  </div>
</div>

<!-- ══ OVERLAY: impression session ═════════════════════════════════════ -->
<div class="overlay" id="session" role="dialog" aria-modal="true" aria-labelledby="s-angle">
  <div class="overlay-inner">
    <div class="spread">
      <p class="eyebrow dim" id="s-count">Impression</p>
      <button class="btn ghost sm" id="s-close" type="button">Leave</button>
    </div>
    <h2 class="angle" id="s-angle">Speak</h2>
    <p class="instruct" id="s-instruct"></p>
    <div class="statement big"><p class="txt" id="s-text"></p></div>
    <div id="s-timerwrap">
      <svg class="ring" id="s-ring" width="112" height="112" viewBox="0 0 112 112" aria-hidden="true">
        <circle class="track" cx="56" cy="56" r="50"></circle>
        <circle class="prog" cx="56" cy="56" r="50" transform="rotate(-90 56 56)"></circle>
        <text class="ring-num" x="56" y="62" id="s-num">60</text>
      </svg>
    </div>
    <div id="s-inputwrap" class="hidden">
      <textarea id="s-input" rows="4"></textarea>
      <p class="note" id="s-inputnote"></p>
    </div>
    <button class="btn primary wide" id="s-done" type="button" disabled>Hold it</button>
    <p class="note" id="s-cite"></p>
  </div>
</div>

<section class="screen" id="screen-today"><div class="wrap">
  <div class="masthead"><h1>Today</h1><span class="daycount" id="today-day"></span></div>
  <div id="today-body"></div>
</div></section>

<section class="screen" id="screen-shifts"><div class="wrap">
  <div class="masthead"><h1>Paradigms</h1><span class="daycount" id="shifts-count"></span></div>
  <div id="shifts-body"></div>
</div></section>

<section class="screen" id="screen-build"><div class="wrap">
  <div class="masthead"><h1>Build a shift</h1><span class="daycount" id="build-step-label"></span></div>
  <div class="rail" id="rail"></div>
  <div id="build-body"></div>
</div></section>

<section class="screen" id="screen-log"><div class="wrap">
  <div class="masthead"><h1>The Record</h1><span class="daycount" id="log-count"></span></div>
  <div id="log-body"></div>
</div></section>

<section class="screen" id="screen-progress"><div class="wrap">
  <div class="masthead"><h1>Reading</h1><span class="daycount" id="prog-day"></span></div>
  <div id="prog-body"></div>
</div></section>

<section class="screen" id="screen-library"><div class="wrap">
  <div class="masthead"><h1>The Law</h1><span class="daycount">Sources &amp; evidence</span></div>
  <div id="lib-body"></div>
</div></section>

<div class="dock">
  <div class="dock-inner">
    <button class="instant-btn" id="instant-open" type="button">Shift me now</button>
    <nav class="tabs" aria-label="Sections"><div class="tabs-inner">
      <button class="tab" data-go="today" type="button"><svg viewBox="0 0 24 24"><path d="M12 3v18M5 8l7-5 7 5"/></svg><span>Today</span></button>
      <button class="tab" data-go="shifts" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg><span>Shifts</span></button>
      <button class="tab" data-go="log" type="button"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M9 9h6M9 13h6M9 17h3"/></svg><span>Record</span></button>
      <button class="tab" data-go="progress" type="button"><svg viewBox="0 0 24 24"><path d="M4 18h4v-5H4zM10 18h4V8h-4zM16 18h4V4h-4z"/></svg><span>Reading</span></button>
      <button class="tab" data-go="library" type="button"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2z"/><path d="M9 3v18"/></svg><span>Law</span></button>
    </div></nav>
  </div>
</div>

<script>

function similarity(a,b){
  const A = new Set(words(String(a).toLowerCase().replace(/[^\w\s]/g,"")));
  const B = words(String(b).toLowerCase().replace(/[^\w\s]/g,""));
  if(!B.length) return 1;
  let hit = 0; B.forEach(w => { if(A.has(w)) hit++; });
  return hit / B.length;
}

/* ═══════════════════════════════════════════════════════════════════════

function checkStatement(t){
  const s = String(t||"").trim(); const out = [];
  if(!s) return out;
  const lower = " " + s.toLowerCase() + " ";
  const w = words(s).length;
  const hasI = /\bi\s+(am|have|earn|attract|close|serve|give|do|move|live|feel|choose|help|make|hold|receive)\b/i.test(s);
  out.push({ ok:hasI, msg: hasI ? "Stated in the present, first person."
    : 'Start from "I am" — or another present-tense "I" verb. It only accepts what is stated as already so.' });
  const future = /\b(will|going to|want to|wanting|hope|hoping|wish|someday|soon|try|trying|plan to|intend)\b/.test(lower);
  out.push({ ok:!future, msg: future ? '"Will", "want", "hope", "try" all file it under future. It stays there.'
    : "No future tense. It reads as fact." });
  const neg = /\b(not|never|no longer|don't|dont|doesn't|stop|quit|less|without|struggle|debt|broke|fail)\b/.test(lower);
  out.push({ ok:!neg, msg: neg ? "A negative still impresses the thing you named. Say what is, not what isn't."
    : "No negatives. Only the new picture." });
  const feel = /\b(grateful|thankful|happy|thrilled|love|joy|joyful|calm|free|proud|easy|easily|delighted|excited|peaceful|certain|safe)\b/.test(lower);
  out.push({ ok:feel, msg: feel ? "Carries a feeling. That is the part that goes in."
    : "No feeling word. Repetition without emotion is recitation — name the feeling the result produces." });
  const lenOk = w >= 8 && w <= 45;
  out.push({ ok:lenOk, msg: lenOk ? w + " words — short enough to hold, long enough to picture."
    : (w < 8 ? "Too thin to feel. Give it enough detail that saying it produces a picture."
             : w + " words. Too long to say from memory five times a day. Cut it under 45.") });
  return out;
}
function checkGoal(t){
  const s = String(t||"").trim(); const out = [];
  if(!s) return out;
  const lower = " " + s.toLowerCase() + " ";
  const incremental = /\b(more|better|improve|increase|a bit|a little|slightly|steady|consistent|keep)\b/.test(lower);
  out.push({ ok:!incremental, msg: incremental
    ? "This reads like an improvement on what you already do. That is an A-goal — it keeps the old method and asks for more effort."
    : "Not an improvement on the current method. Good — that is the point." });
  const specific = /\d/.test(s);
  out.push({ ok:specific, msg: specific ? "Has a number in it, so it can be measured and therefore missed."
    : "No number. Hill's first step is an exact amount. A goal you cannot miss cannot pull you." });
  out.push({ ok:words(s).length >= 5, msg: words(s).length >= 5 ? "Specific enough to picture."
    : "Too vague to picture. Say exactly what the result looks like." });
  return out;
}
/* Bridges for when the statement is further than belief can currently reach.
   Repeating something you do not believe makes low self-worth worse, so we
   lower the statement rather than shout it. */
function bridges(stmt){
  /* Templates are starting shapes, not final copy — the chosen one drops into
     an editable box. Every form here stays grammatical whatever clause the
     statement is, which the naive "someone who <clause>" splice did not. */
  const s = String(stmt||"").trim().replace(/[.!]+$/,"");
  const core = s.replace(/^i am so happy and grateful now that\s+/i,"")
                .replace(/^\s*i\s+/i,"").replace(/[.!]+$/,"");
  return [
    { k:"Becoming", t:"I am becoming someone who can say this and mean it: " + s + "." },
    { k:"Question", t:"Will I " + (core || "do this") + "?" },
    { k:"Evidence", t:"I take one real action toward this every single day, and I have the log to prove it." },
    { k:"Directional", t:"Every day I am measurably closer to this being true, and I can feel it." }
  ];
}

/* Promotion from bridge to the real statement, once the evidence log can
   carry it. Ten entries is the gate. */
function ladderCheck(a){
  if(!a.useBridge) return "";
  const evi = S.evidence.filter(e => e.shiftId === a.id && !e.sys && e.kind !== "contrast").length;
  if(evi >= 10){
    return `<div class="banner"><p class="eyebrow">Ready to raise the statement</p>
      <p>${evi} pieces of evidence logged against this paradigm. That is what a believable statement is built out of. Say the real one out loud and see where it lands now.</p>
      <div class="row wrap" style="margin-top:.8rem"><button class="btn sm" data-act="ladder-up" type="button">Move up to the real statement</button>
        <button class="btn ghost sm" data-act="ladder-later" type="button">Not yet</button></div></div>`;
  }
  return `<div class="plate tight"><p class="eyebrow dim">Bridge in use · ${evi} / 10 evidence</p>
    <div class="gauge thin"><i style="width:${Math.min(100,evi*10)}%"></i></div>
    <p class="note">Target: ${esc(a.statement)}</p></div>`;
}
function daysToGoal(a){
  if(!a.goalDate) return "";
  const n = daysBetween(today(), a.goalDate);
  if(n > 1) return n + " days left. You still do not know how, and that is correct — commit first, the method shows up en route.";
  if(n === 1) return "Tomorrow.";
  if(n === 0) return "Today is the date.";
  return Math.abs(n) + " days past. Score it honestly, then set the next one bigger, not smaller.";
}
function quietDays(){
  const a = active(); if(!a) return 0;
  let n = 0;
  for(let i=1;i<=30;i++){
    const k = shiftDays(today(), -i);
    if(k < a.committedAt) break;
    const rec = dayMap()[k];
    if(rec && rec.imp.length) break;
    n++;
  }
  return n;
}

function stats(){
  const a = active(), dm = dayMap();
  const keys = Object.keys(dm).sort();
  let imp=0, leaps=0, through=0, back=0, impDays=0, swaps=0, fac=0;
  keys.forEach(k => {
    const d = dm[k];
    imp += d.imp.length;
    if(d.imp.length) impDays++;
    if(d.leap) leaps++;
    if(d.faculty) fac++;
    if(d.terror){ if(d.terror.crossed) through++; else back++; }
    d.swaps.forEach(x => { if(x) swaps++; });
  });
  let streak = 0;
  for(let i=0;i<400;i++){
    const d = dm[shiftDays(today(), -i)];
    if(d && d.imp.length) streak++;
    else if(i > 0) break;
  }
  let best=0, run=0, prev=null;
  keys.forEach(k => {
    if(!dm[k].imp.length){ run=0; prev=k; return; }
    run = (prev && daysBetween(prev,k)===1 && dm[prev] && dm[prev].imp.length) ? run+1 : 1;
    best = Math.max(best, run); prev = k;
  });
  const n = (a && a.slots) || 5;
  const win = Math.max(1, Math.min(14, programDay()));
  let impWin=0, leapWin=0;
  for(let i=0;i<win;i++){
    const d = dm[shiftDays(today(), -i)];
    if(!d) continue;
    impWin += Math.min(d.imp.length, n);
    if(d.leap) leapWin++;
  }
  const inner = Math.min(1, impWin/(n*win));
  const outer = Math.min(1, leapWin/win);
  return { imp, leaps, through, back, impDays, swaps, fac, streak, best, inner, outer,
           strength: Math.round(100*Math.sqrt(inner*outer)), n, win };
}

function milestone(v, mark, text){
  const hit = v >= mark;
  return `<div class="task"><span class="tick${hit?" on":""}" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 12l6 6L20 6"/></svg></span>
    <div class="task-body"><div class="task-title" style="${hit?"":"color:var(--text-faint)"}">${mark} days · ${v}/${mark}</div>
    <div class="task-sub">${esc(text)}</div></div></div>`;
}
function stepChart(){
  const W=320, H=100, pad=6, days=21, dm=dayMap();
  const vals=[]; let run=0;
  for(let i=days-1;i>=0;i--){ const d = dm[shiftDays(today(), -i)]; if(d && d.leap) run++; vals.push(run); }
  const max = Math.max(1, run);
  const x = i => pad + (i*(W-pad*2)/(days-1));
  const y = v => H - pad - (v/max)*(H-pad*2);
  let dstr = "M " + x(0) + " " + y(vals[0]);
  for(let i=1;i<vals.length;i++) dstr += " L " + x(i) + " " + y(vals[i-1]) + " L " + x(i) + " " + y(vals[i]);
  const grid = [0,.5,1].map(f=>`<line class="grid" x1="${pad}" y1="${pad+f*(H-pad*2)}" x2="${W-pad}" y2="${pad+f*(H-pad*2)}"/>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Cumulative out-of-character acts over 21 days: ${run} total">
    ${grid}<path class="line" d="${dstr}"/><circle class="cap" cx="${x(days-1)}" cy="${y(run)}" r="3"/></svg>`;
}

    { t:"Installed before you chose",
      p:"The bulk of it went in between birth and about age seven, absorbed from the people around you, without your awareness and certainly without your consent. It then runs roughly 95% of your behaviour. None of that is your fault. All of it is now your responsibility.",
      a:"Separate blame from responsibility. Only the second one is useful." },
    { t:"Prosperity is a consciousness",
      p:"From You Were Born Rich: wealth follows a state you occupy, not a state you pursue. Picture yourself as someone already inside it rather than someone reaching for it — and let go of the scarcity position first, because the room has to be empty before anything else fits in it.",
      a:"Ask what someone already there would do at 9am tomorrow. Then do that." }
  ]},
  { g:"Napoleon Hill · the six steps Proctor taught for fifty years", items:[
    { t:"An exact amount",
      p:"Not 'more', not 'rich'. A definite figure. A vague target cannot be missed, and anything that cannot be missed cannot pull you.",
      a:"Write the number. Then divide it into leases, then conversations, then today." },
    { t:"What you give in return",
      p:"The second step, and the one nearly everyone skips. Money moves in exchange for service rendered. Naming the exchange is what stops the whole thing curdling into wishing.",
      a:"Say exactly what you deliver and to how many people." },
    { t:"A definite date",
      p:"A date turns a wish into a schedule and makes the arithmetic honest.",
      a:"Put it in the calendar, not in your head." },
    { t:"Begin at once, ready or not",
      p:"Hill's fourth step says make a plan and start immediately whether you feel prepared or not. Written in 1937 and identical to Pritchett's instruction sixty years later, which suggests it is load-bearing.",
      a:"Start the imperfect version today." },
    { t:"Read it aloud, twice daily",
      p:"Once on rising, once before sleep. Proctor kept this for over fifty years and read the same book daily for the same reason: it is not information, it is impression.",
      a:"Morning and night are non-negotiable. Everything else is extra." }
  ]},
  { g:"Price Pritchett · You²", items:[
    { t:"Quantum leap, not increment",
      p:"The move is discontinuous — you skip stages rather than grinding through each one. You do not reach a different order of results by applying the same method harder; you change methods and land where the old one could not go at any speed.",
      a:"When you catch yourself planning to try harder, stop. Ask what a different method looks like." },
    { t:"The bigger goal is the easier one",
      p:"A modest target lets the current approach survive, so you keep it and get modest results. An outrageous target makes the current approach visibly useless, which forces a new one into existence. Size and difficulty are not the same axis.",
      a:"Raise the target until the old plan is obviously absurd." },
    { t:"Draw the map as you go",
      p:"Waiting for a complete plan is the most respectable form of not starting. Get the picture of the outcome clear, move confidently at it, and resources you could not have seen from the start show up.",
      a:"Commit to the outcome before you can defend the method." },
    { t:"Behave your way in",
      p:"Acting your way into new thinking beats thinking your way into new acting. Behaviour is under your control right now; belief is not. Do what the new person does and belief follows the evidence.",
      a:"One out-of-character act today, before you feel ready." },
    { t:"Quit trying",
      p:"Trying is the built-in excuse: it describes effort while leaving the outcome optional. Commitment removes the exit, and removing the exit changes what you actually do.",
      a:"Delete 'try' from how you state anything you intend." },
    { t:"Failure is the toll",
      p:"Going for a leap guarantees more failure, faster. That is the cost structure of the method, not a sign you chose wrong. The only expensive failure is the slow one nobody learned from.",
      a:"Fail faster and file what it taught you inside the hour." }
  ]},
  { g:"Where the evidence corrects the practice", items:[
    { t:"Visualising alone makes it worse",
      p:"Oettingen's work found vivid positive fantasy predicted LESS weight lost, slower recovery and lower starting salaries. The mind treats the imagined outcome as partly achieved and demobilises. The fix is mental contrasting: picture the outcome, then immediately name the obstacle inside you.",
      a:"Never run the picture without the obstacle. Every visualization step here enforces it." },
    { t:"If-then plans are the strongest lever",
      p:"Implementation intentions — 'when X happens, I will do Y' — carry an effect around d≈0.65 across 94 studies on actually attaining goals. That is enormous for something that takes ten seconds to write.",
      a:"Every habit swap here is one. Write the trigger, not just the intention." },
    { t:"Affirmations can backfire",
      p:"Wood, Perunovic and Lee found people repeating 'I am a lovable person' felt WORSE afterwards if they had low self-esteem, and better only if they already had high self-esteem. The statement collides with what you actually believe, and the collision goes to the incumbent.",
      a:"Rate believability honestly. Below five, run a bridge and let logged evidence raise it." },
    { t:"Asking beats declaring",
      p:"Senay, Albarracín and Noguchi found people primed with 'Will I…' outperformed those primed with 'I will…' on actual goal-directed behaviour — the question generates your own reasons instead of importing someone else's.",
      a:"On a bad day, switch the statement to its question form." },
    { t:"Breathing to neutral is fast and real",
      p:"A Stanford randomised trial found five minutes a day of cyclic sighing — two inhales through the nose, one long exhale through the mouth — beat mindfulness meditation on mood and cut respiratory rate. It is the quickest honest route to Proctor's neutral.",
      a:"Five rounds. It is the second stage of every instant shift." },
    { t:"Money scripts are measurable",
      p:"Klontz's inventory identifies four inherited beliefs about money — avoidance, worship, status and vigilance — formed in childhood around emotionally charged events. Three of the four predict lower income and net worth decades later. It is Proctor's pre-seven paradigm with data attached.",
      a:"Run the money roots check once. Work on the rule, not the memory." }
  ]}
];
function renderLibrary(){
  el("lib-body").innerHTML = LIB.map(g=>`<p class="grouphead">${esc(g.g)}</p>
    ${g.items.map(i=>`<div class="card"><h3>${esc(i.t)}</h3><p>${esc(i.p)}</p><p class="apply">${esc(i.a)}</p></div>`).join("")}`).join("")
  + `<div class="plate" style="margin-top:2rem"><p class="eyebrow">On the sources</p>
      <p class="note">These are working principles restated in plain language, not quotations. Read the originals: Bob Proctor's lectures, <em>Change Your Paradigm, Change Your Life</em> and <em>You Were Born Rich</em>; Price Pritchett's <em>You²</em>; Napoleon Hill's <em>Think and Grow Rich</em>. The corrections are Oettingen on mental contrasting, Gollwitzer and Sheeran on implementation intentions, Wood, Perunovic and Lee 2009 on positive self-statements, Senay, Albarracín and Noguchi 2010 on interrogative self-talk, Balban, Huberman and Spiegel 2023 on cyclic sighing, and the Klontz Money Script Inventory. Full citations are in RESEARCH.md in the repository.</p>
      <p class="note" style="margin-top:.9rem">This is belief and behaviour work. It is not treatment for trauma and does not pretend to be. If the childhood material itself gets loud — not the money rule, the memory — that is a different track and it needs a person, not an app.</p></div>`;
}

/* ═══════════════════════════════════════════════════════════════════════
   BACKUP
   ═══════════════════════════════════════════════════════════════════════ */
function backupName(){ return "impression-engine-" + today() + ".json"; }
function backupText(){ return JSON.stringify(S, null, 2); }
function ioPanel(html){ const b = el("io"); if(!b) return; b.innerHTML = html; b.classList.remove("hidden"); }
function ioStatus(msg, good){ const st = el("io-status"); if(st){ st.textContent = msg; st.style.color = good ? "var(--patina)" : "var(--retreat)"; } }
function showExport(){
  ioPanel(`<label class="fld"><span>Your backup</span><textarea id="io-text" rows="4" readonly>${esc(backupText())}</textarea></label>
    <div class="row wrap"><button class="btn sm" data-act="io-copy" type="button">Copy text</button>
      <button class="btn sm" data-act="io-file" type="button">Save as file</button>
      <button class="btn ghost sm" data-act="io-close" type="button">Close</button></div>
    <p class="note" id="io-status">Copying the text is the one that always works. Paste it somewhere you will still have in a year.</p>`);
}
function showImport(){
  ioPanel(`<label class="fld"><span>Paste a backup</span><textarea id="io-text" rows="4" placeholder="Paste the JSON from a previous backup."></textarea></label>
    <div class="row wrap"><button class="btn sm" data-act="io-restore" type="button">Restore</button>
      <button class="btn sm" data-act="io-pick" type="button">Choose a file</button>
      <button class="btn ghost sm" data-act="io-close" type="button">Close</button></div>
    <input type="file" id="import-file" accept="application/json,.json" class="hidden">
    <p class="note" id="io-status">Restoring replaces everything currently in this browser.</p>`);
}
async function copyBackup(){
  const ta = el("io-text");
  try{ await navigator.clipboard.writeText(ta.value); ioStatus("Copied. Paste it into a note or email it to yourself.", true); }
  catch(e){ ta.removeAttribute("readonly"); ta.focus(); ta.select();
    ioStatus("Clipboard is blocked here. The text is selected — copy it by hand.", false); }
}
async function saveBackupFile(){
  const name = backupName(), text = backupText();
  try{
    if(window.claude && typeof window.claude.use === "function"){
      const dl = await window.claude.use("downloads");
      if(!dl){ ioStatus("Saving files is not available here. Use Copy text instead.", false); return; }
      try{ await dl.save({ filename:name, data:text }); ioStatus("Saved as " + name + ".", true); }
      catch(err){
        const code = err && err.code;
        ioStatus(code === "declined" ? "Save cancelled. Nothing was written."
          : code === "rate_limited" ? "A save prompt is already open. Finish that one first."
          : "That save did not go through. Use Copy text instead.", false);
      }
      return;
    }
  }catch(e){}
  const blob = new Blob([text], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  ioStatus("Saved as " + name + ".", true);
}
function restoreFrom(text){
  try{
    const inc = JSON.parse(text);
    if(!inc || typeof inc !== "object" || Array.isArray(inc)) throw new Error("shape");
    if(!("days" in inc) && !("shifts" in inc) && !("shift" in inc)) throw new Error("shape");
    S = migrate(Object.assign(clone(BLANK), inc));
    save(); go(active() ? "today" : "shifts");
  }catch(err){ ioStatus("That is not a backup from this app. Paste the whole JSON, starting with {.", false); }
}
document.addEventListener("change", e => {
  if(e.target.id !== "import-file") return;
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const r = new FileReader();
  r.onload = () => restoreFrom(r.result);
  r.onerror = () => ioStatus("That file could not be read.", false);
  r.readAsText(file);
});

/* ═══════════════════════════════════════════════════════════════════════
   NAVIGATION + EVENTS
   ═══════════════════════════════════════════════════════════════════════ */
const TABS = ["today","shifts","log","progress","library"];
function go(v){
  S.view = v; save();
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("on"));
  const target = el("screen-" + v);
  if(target) target.classList.add("on");
  document.querySelectorAll(".tab").forEach(t =>
    t.classList.toggle("on", t.dataset.go === v || (v === "build" && t.dataset.go === "shifts")));
  window.scrollTo(0,0);
  render();
}
function render(){
  if(S.view === "today") renderToday();
  else if(S.view === "shifts") renderShifts();
  else if(S.view === "build") renderBuild();
  else if(S.view === "log") renderLog();
  else if(S.view === "progress") renderProgress();
  else if(S.view === "library") renderLibrary();
}

el("instant-open").addEventListener("click", openInstant);
el("s-done").addEventListener("click", () => closeSession(true));
el("s-close").addEventListener("click", () => closeSession(false));
el("i-close").addEventListener("click", () => { if(rootsState) endRoots(); else closeInstant(false); });
el("i-next").addEventListener("click", () => {
  if(rootsState){
    const st = rootsState;
    if(st.i > SCRIPT_ITEMS.length){
      S.roots = { done:true, score:st.score, dominant:st.dominant, rule:st.rule,
                  source:st.source, counter:st.counter, on:today() };
      save(); endRoots(); go("shifts"); return;
    }
    st.i++; renderRootsFlow(); return;
  }
  if(!iState) return;
  const st = I_STAGES[iState.i];
  if(!st.ok(iState.d)) return;
  if(breathTimer){ clearTimeout(breathTimer); breathTimer = null; }
  if(iState.i === I_STAGES.length-1){ closeInstant(true); return; }
  iState.i++; renderInstant();
});
document.addEventListener("keydown", e => {
  if(e.key !== "Escape") return;
  if(el("session").classList.contains("on")) closeSession(false);
  else if(el("instant").classList.contains("on")){ if(rootsState) endRoots(); else closeInstant(false); }
});

document.addEventListener("click", e => {
  const t = e.target.closest("[data-go],[data-nav],[data-act],[data-chip],[data-toggle],[data-bscale],[data-bridge],[data-iscale],[data-ichip],[data-rscale],[data-rrule]");
  if(!t) return;

  if(t.dataset.go){ go(t.dataset.go); return; }
  if(t.dataset.ichip && iState){ iState.d.feeling = t.dataset.val; renderInstant(); return; }
  if(t.dataset.iscale && iState){ iState.d[t.dataset.iscale] = +t.dataset.val; renderInstant(); return; }
  if(t.dataset.rscale && rootsState){ rootsState.answers[rootsState.i] = +t.dataset.val; renderRootsFlow(); return; }
  if(t.dataset.rrule && rootsState){ rootsState.rule = t.dataset.rrule; renderRootsFlow(); return; }

  if(t.dataset.chip){
    const f = t.dataset.chip;
    S.draft[f] = (S.draft[f] === t.dataset.val) ? "" : t.dataset.val;
    save(); renderBuild(); return;
  }
  if(t.dataset.bscale){ S.draft.believability = +t.dataset.val; save(); renderBuild(); return; }
  if(t.dataset.bridge){
    S.draft.bridge = (S.draft.bridge === t.dataset.bridge) ? "" : t.dataset.bridge;
    save(); renderBuild(); return;
  }
  /* editing the bridge box must not clear the template tick unless emptied */
  if(t.dataset.toggle){
    const d = day();
    if(t.dataset.toggle === "leap") d.leap = !d.leap;
    if(t.dataset.toggle === "faculty") d.faculty = !d.faculty;
    if(t.dataset.toggle === "swap") d.swaps[+t.dataset.i] = !d.swaps[+t.dataset.i];
    save(); renderToday(); return;
  }

  const nav = t.dataset.nav;
  if(nav === "back"){ S.step = Math.max(0, S.step-1); save(); renderBuild(); return; }
  if(nav === "next"){ S.step = Math.min(STEPS.length, S.step+1); save(); renderBuild(); return; }
  if(nav === "cancel"){ S.draft = {}; S.step = 0; save(); go("shifts"); return; }
  if(nav === "commit"){ commit(); return; }

  const act = t.dataset.act;
  if(act === "session"){ openSession(); return; }
  if(act === "new-shift"){ S.draft = {}; S.step = 0; save(); go("build"); return; }
  if(act === "edit-shift"){
    const s = S.shifts.find(x => x.id === t.dataset.id);
    if(s){ S.draft = Object.assign({}, s, { editingId:s.id }); S.step = 0; save(); go("build"); }
    return;
  }
  if(act === "activate"){ S.activeId = t.dataset.id; save(); go("today"); return; }
  if(act === "archive"){
    const s = S.shifts.find(x => x.id === t.dataset.id);
    if(s){
      s.archivedAt = today();
      if(S.activeId === s.id){ const n = liveShifts()[0]; S.activeId = n ? n.id : null; }
      save(); renderShifts();
    }
    return;
  }
  if(act === "unarchive"){
    const s = S.shifts.find(x => x.id === t.dataset.id);
    if(s){ s.archivedAt = null; if(!S.activeId) S.activeId = s.id; save(); renderShifts(); }
    return;
  }
  if(act === "roots-start"){ startRoots(); return; }
  if(act === "ladder-up"){ const a = active(); if(a){ a.useBridge = false; save(); renderToday(); } return; }
  if(act === "ladder-later"){
    const a = active();
    if(a){ S.evidence.unshift({ shiftId:a.id, on:today(), sys:true, text:"Chose to stay on the bridge. No hurry — the ladder waits." });
      save(); renderToday(); }
    return;
  }
  if(act === "terror"){
    const d = day();
    const note = (el("terror-note") && el("terror-note").value.trim()) || "";
    if(t.dataset.crossed === "none") d.terror = { crossed:true, note: note || "Did not reach the edge today. Worth asking whether the day was safe by accident or by design." };
    else d.terror = { crossed: t.dataset.crossed === "1", note };
    save(); renderToday(); return;
  }
  if(act === "terror-clear"){ day().terror = null; save(); renderToday(); return; }
  if(act === "evi-add"){
    const v = el("evi-in").value.trim();
    if(v){ S.evidence.unshift({ shiftId:S.activeId, text:v, on:today() }); save(); renderLog(); }
    return;
  }
  if(act === "fail-add"){
    const v = el("fail-in").value.trim();
    if(v){ S.failures.unshift({ shiftId:S.activeId, text:v, on:today() }); save(); renderLog(); }
    return;
  }
  if(act === "export"){ showExport(); return; }
  if(act === "import-open"){ showImport(); return; }
  if(act === "io-copy"){ copyBackup(); return; }
  if(act === "io-file"){ saveBackupFile(); return; }
  if(act === "io-pick"){ el("import-file").click(); return; }
  if(act === "io-restore"){ restoreFrom(el("io-text").value.trim()); return; }
  if(act === "io-close"){ el("io").classList.add("hidden"); return; }
});

document.addEventListener("input", e => {
  const tgt = e.target;

  if(tgt.dataset.ifield && iState){
    iState.d[tgt.dataset.ifield] = tgt.value;
    el("i-next").disabled = !I_STAGES[iState.i].ok(iState.d);
    return;
  }
  if(tgt.dataset.rfield && rootsState){
    rootsState[tgt.dataset.rfield] = tgt.value;
    const need = rootsState.i === SCRIPT_ITEMS.length ? "rule" : "counter";
    el("i-next").disabled = words(rootsState[need]).length < (need === "counter" ? 3 : 1);
    return;
  }
  if(tgt.dataset.ctx){
    const v = parseFloat(tgt.value);
    S.ctx[tgt.dataset.ctx] = isNaN(v) ? 0 : v;
    save();
    /* Recompute the derived numbers in place without rebuilding the screen,
       so the field keeps focus and the caret while typing. */
      const c = S.ctx;
    const per = (+c.avgRent||0) * ((+c.commissionPct||0)/100);
    const lea = per > 0 ? (+c.targetMonthly||0)/per : 0;
    const con = (+c.closeRate > 0) ? lea/(c.closeRate/100) : 0;
    const box = tgt.closest(".plate");
    const cells = box ? box.querySelectorAll(".metric .v") : [];
    if(cells.length === 4){
      cells[0].textContent = money(per);
      cells[1].textContent = lea.toFixed(1);
      cells[2].textContent = Math.ceil(con);
      cells[3].textContent = Math.ceil(con/22);
      return;
    }
    /* The panel is not on screen yet — first real target typed. Rebuild once,
       then put the caret back exactly where it was. */
    if(per > 0 && (+c.targetMonthly||0) > 0){
      const field = tgt.dataset.ctx, caret = tgt.selectionStart, y = window.scrollY;
      renderShifts();
      window.scrollTo(0, y);
      const again = document.querySelector('[data-ctx="' + field + '"]');
      if(again){ again.focus(); try{ again.setSelectionRange(caret, caret); }catch(err){} }
    }
    return;
  }

  const f = tgt.dataset.f;
  if(!f) return;
  if(tgt.dataset.save === "day"){ if(f === "leapNote"){ day().leapNote = tgt.value; save(); } return; }

  const d = S.draft;
  if(/^habit(\d)$/.test(f)){
    const i = +f.slice(5); d.habits = d.habits || ["","",""]; d.habits[i] = tgt.value;
  } else if(/^swap(\d)(trigger|new)$/.test(f)){
    const m = f.match(/^swap(\d)(trigger|new)$/);
    d.swaps = d.swaps || [{},{},{}];
    d.swaps[+m[1]] = d.swaps[+m[1]] || {};
    d.swaps[+m[1]][m[2] === "trigger" ? "trigger" : "now"] = tgt.value;
  } else if(f === "slots"){
    d.slots = +tgt.value;
  } else {
    d[f] = tgt.value;
    /* Editing the statement invalidates the believability rating it was for. */
    if(f === "statement"){ d.believability = null; d.bridge = ""; }
  }
  save();

  if(f === "statement" || f === "goal"){
    const list = document.querySelector(".checks");
    if(list){
      const checks = f === "statement" ? checkStatement(tgt.value) : checkGoal(tgt.value);
      list.innerHTML = checks.map(c=>`<li class="${c.ok?"ok":""}">${esc(c.msg)}</li>`).join("");
    }
  }
  const btn = document.querySelector('[data-nav="next"]');
  if(btn && S.step < STEPS.length) btn.disabled = !STEPS[S.step].valid(S.draft);
});

function commit(){
  const d = S.draft;
  const editing = d.editingId ? S.shifts.find(x => x.id === d.editingId) : null;
  const rec = {
    id: editing ? editing.id : "s" + Date.now().toString(36),
    name: String(d.name || (d.arena ? d.arena + " paradigm" : "My paradigm")).trim(),
    arena:d.arena, results:d.results, belief:d.belief, habits:d.habits,
    statement:String(d.statement||"").trim(),
    believability:d.believability,
    bridge:String(d.bridge||"").trim(),
    useBridge: d.believability != null && d.believability < 5 && !!d.bridge,
    goal:String(d.goal||"").trim(), goalDate:d.goalDate, give:String(d.give||"").trim(),
    swaps:d.swaps, leap:String(d.leap||"").trim(), slots:d.slots || 5,
    committedAt: editing ? editing.committedAt : today(),
    archivedAt: editing ? editing.archivedAt : null
  };
  if(editing) Object.assign(editing, rec);
  else S.shifts.push(rec);
  S.activeId = rec.id;
  if(!S.days[rec.id]) S.days[rec.id] = {};
  S.draft = {}; S.step = 0;
  save();
  go("today");
}

/* ── Boot ──────────────────────────────────────────────────────────────── */
(function boot(){
  if(!active() && S.view !== "build") S.view = "shifts";
  if(!TABS.includes(S.view) && S.view !== "build") S.view = active() ? "today" : "shifts";
  go(S.view);
  /* Offline shell. Secure origins only — file:// and sandboxed hosts skip it. */
  const secure = location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1";
  if("serviceWorker" in navigator && secure){
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
</script>
