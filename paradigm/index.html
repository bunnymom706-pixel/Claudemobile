<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1118">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>The Impression Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* ── Tokens ──────────────────────────────────────────────────────────────
   Single committed visual world: a dark plate that ideas get struck into.
   Used at 5am and last thing at night, so it is deliberately dark-only.
   Every colour is painted explicitly; nothing is inherited from the host. */
:root{
  --ground:#0F1118;
  --plate:#181B24;
  --plate-hi:#1F2330;
  --recess:#0A0B10;
  --rule:#272C39;
  --rule-soft:#1D2130;
  --text:#E7E4DC;
  --text-dim:#9CA0AE;
  --text-faint:#6A6E7C;
  --copper:#C4854B;
  --copper-lit:#E0A868;
  --copper-deep:#7A5028;
  --patina:#6FB39A;
  --retreat:#7C7FA8;
  --shadow:0 1px 0 rgba(255,255,255,.045) inset, 0 2px 14px rgba(0,0,0,.5);
  --press:inset 0 2px 6px rgba(0,0,0,.75), inset 0 -1px 0 rgba(255,255,255,.05);
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --disp:"Archivo",var(--sans);
  --step:1.5rem;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--ground);
  color:var(--text);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--copper-lit);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── Shell ─────────────────────────────────────────────────────────────── */
.wrap{max-width:34rem;margin:0 auto;padding:0 1.15rem}
.screen{display:none;padding-top:1.5rem}
.screen.on{display:block}
.masthead{
  display:flex;align-items:baseline;justify-content:space-between;gap:1rem;
  padding:1.4rem 0 1.1rem;border-bottom:1px solid var(--rule-soft);margin-bottom:1.5rem;
}
.masthead h1{
  margin:0;font-family:var(--disp);font-weight:800;font-stretch:118%;
  font-size:1.02rem;letter-spacing:.13em;text-transform:uppercase;color:var(--text);
}
.masthead .daycount{font-family:var(--mono);font-size:.72rem;color:var(--copper);letter-spacing:.08em;white-space:nowrap}

/* ── Type ──────────────────────────────────────────────────────────────── */
h2.sec{
  font-family:var(--disp);font-weight:800;font-stretch:112%;
  font-size:1.32rem;letter-spacing:-.005em;margin:0 0 .35rem;text-wrap:balance;
}
.eyebrow{
  font-family:var(--mono);font-size:.68rem;letter-spacing:.17em;text-transform:uppercase;
  color:var(--copper);margin:0 0 .5rem;
}
.eyebrow.dim{color:var(--text-faint)}
p.lede{color:var(--text-dim);margin:0 0 1.15rem;font-size:.94rem;max-width:34em}
p.note{color:var(--text-faint);font-size:.82rem;margin:.5rem 0 0;line-height:1.5}
.src{font-family:var(--mono);font-size:.66rem;letter-spacing:.06em;color:var(--text-faint);text-transform:uppercase}

/* ── Plates ────────────────────────────────────────────────────────────── */
.plate{
  background:var(--plate);border:1px solid var(--rule-soft);border-radius:3px;
  box-shadow:var(--shadow);padding:1.15rem;margin-bottom:1rem;
}
.plate.tight{padding:.9rem 1rem}
.plate-head{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:.75rem}
.stack{display:flex;flex-direction:column;gap:1rem}
.row{display:flex;gap:.6rem;align-items:center}
.row.wrap{flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:baseline;gap:1rem}

/* ── The statement: struck into the plate ──────────────────────────────── */
.statement{
  background:var(--recess);border:1px solid var(--rule);border-radius:3px;
  box-shadow:var(--press);padding:1.35rem 1.2rem;
}
.statement .txt{
  font-family:var(--disp);font-weight:700;font-stretch:104%;
  font-size:1.28rem;line-height:1.32;letter-spacing:-.012em;
  color:var(--text);text-wrap:balance;margin:0;
  text-shadow:0 1px 0 rgba(0,0,0,.85);
}
.statement.big .txt{font-size:1.62rem;font-weight:800}

/* ── Tally strikes: one mark pressed in per impression ─────────────────── */
.tally{display:flex;flex-wrap:wrap;gap:.42rem;align-items:center;min-height:34px}
.strike{
  width:11px;height:32px;border-radius:1.5px;
  background:var(--recess);box-shadow:var(--press);
  border:1px solid var(--rule-soft);
}
.strike.hit{
  background:linear-gradient(180deg,var(--copper-lit),var(--copper-deep));
  border-color:var(--copper-deep);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28), 0 0 10px rgba(196,133,75,.22);
}
.strike.fresh{animation:press .34s cubic-bezier(.3,1.4,.5,1)}
@keyframes press{0%{transform:scaleY(1.5) translateY(-4px);opacity:.3}60%{transform:scaleY(.9)}100%{transform:none;opacity:1}}
.tally-meta{font-family:var(--mono);font-size:.72rem;color:var(--text-dim);letter-spacing:.05em;font-variant-numeric:tabular-nums}

/* ── Buttons ───────────────────────────────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  background:var(--plate-hi);color:var(--text);border:1px solid var(--rule);
  border-radius:3px;padding:.72rem 1.05rem;cursor:pointer;
  font-family:var(--mono);font-size:.76rem;letter-spacing:.11em;text-transform:uppercase;
  transition:background .14s ease,border-color .14s ease,transform .06s ease;
}
.btn:hover{background:#242938;border-color:var(--rule)}
.btn:active{transform:translateY(1px)}
.btn.primary{
  background:linear-gradient(180deg,var(--copper),#A96C36);
  border-color:var(--copper-deep);color:#140D06;font-weight:500;
}
.btn.primary:hover{background:linear-gradient(180deg,var(--copper-lit),var(--copper))}
.btn.wide{width:100%}
.btn.ghost{background:transparent;border-color:var(--rule-soft);color:var(--text-dim)}
.btn.ghost:hover{color:var(--text);border-color:var(--rule)}
.btn.sm{padding:.5rem .75rem;font-size:.68rem}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.done{background:transparent;border-color:var(--copper-deep);color:var(--copper);cursor:default}
.btn.done:hover{background:transparent}

/* ── Inputs ────────────────────────────────────────────────────────────── */
label.fld{display:block;margin-bottom:1rem}
label.fld > span{
  display:block;font-family:var(--mono);font-size:.68rem;letter-spacing:.13em;
  text-transform:uppercase;color:var(--text-dim);margin-bottom:.4rem;
}
input[type=text],input[type=date],textarea,select{
  width:100%;background:var(--recess);border:1px solid var(--rule);border-radius:3px;
  padding:.7rem .8rem;font-size:.95rem;box-shadow:var(--press);
}
textarea{resize:vertical;min-height:5.5rem;line-height:1.5}
input::placeholder,textarea::placeholder{color:var(--text-faint)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.9rem}
.chip{
  background:var(--recess);border:1px solid var(--rule);color:var(--text-dim);
  border-radius:100px;padding:.35rem .7rem;font-size:.8rem;cursor:pointer;text-align:left;
}
.chip:hover{color:var(--text);border-color:var(--copper-deep)}
.chip.on{background:var(--copper-deep);border-color:var(--copper);color:var(--text)}

/* ── Validation notes ──────────────────────────────────────────────────── */
.checks{list-style:none;margin:.6rem 0 0;padding:0;display:flex;flex-direction:column;gap:.4rem}
.checks li{
  font-size:.82rem;color:var(--retreat);line-height:1.45;
  padding-left:1rem;position:relative;
}
.checks li::before{content:"";position:absolute;left:0;top:.55em;width:6px;height:1px;background:var(--retreat)}
.checks li.ok{color:var(--patina)}
.checks li.ok::before{background:var(--patina)}

/* ── Step rail (builder) ───────────────────────────────────────────────── */
.rail{display:flex;gap:3px;margin-bottom:1.4rem}
.rail i{flex:1;height:2px;background:var(--rule-soft);border-radius:1px}
.rail i.on{background:var(--copper)}

/* ── Task rows ─────────────────────────────────────────────────────────── */
.task{
  display:flex;gap:.8rem;align-items:flex-start;
  padding:.85rem 0;border-bottom:1px solid var(--rule-soft);
}
.task:last-child{border-bottom:0;padding-bottom:0}
.task:first-child{padding-top:0}
.tick{
  flex:0 0 22px;width:22px;height:22px;margin-top:.1rem;border-radius:2px;
  background:var(--recess);border:1px solid var(--rule);box-shadow:var(--press);
  cursor:pointer;display:grid;place-items:center;padding:0;
}
.tick svg{width:13px;height:13px;stroke:var(--copper-lit);stroke-width:2.4;fill:none;opacity:0;
  stroke-linecap:round;stroke-linejoin:round}
.tick.on{background:var(--copper-deep);border-color:var(--copper)}
span.tick{cursor:default}
.tick.on svg{opacity:1}
.task-body{flex:1;min-width:0}
.task-title{font-size:.94rem;line-height:1.4}
.task-title.struck{color:var(--text-faint);text-decoration:line-through;text-decoration-color:var(--copper-deep)}
.task-sub{font-size:.8rem;color:var(--text-faint);margin-top:.15rem;line-height:1.45}

/* ── Session overlay ───────────────────────────────────────────────────── */
.session{
  position:fixed;inset:0;background:var(--ground);z-index:50;
  display:none;flex-direction:column;padding:1.4rem;
  padding-bottom:calc(1.4rem + env(safe-area-inset-bottom));
  overflow-y:auto;
}
.session.on{display:flex;animation:rise .22s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.session-inner{max-width:34rem;margin:auto;width:100%;display:flex;flex-direction:column;gap:1.2rem}
.session .angle{
  font-family:var(--disp);font-weight:900;font-stretch:125%;font-size:2.1rem;
  letter-spacing:.02em;text-transform:uppercase;color:var(--copper);margin:0;line-height:1;
}
.session .instruct{color:var(--text-dim);font-size:.95rem;margin:0;max-width:34em}
.ring{display:block;margin:0 auto}
.ring circle{fill:none;stroke-width:3}
.ring .track{stroke:var(--rule)}
.ring .prog{stroke:var(--copper);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.ring-num{
  font-family:var(--mono);font-size:1.1rem;fill:var(--text);text-anchor:middle;
  font-variant-numeric:tabular-nums;
}

/* ── Metrics ───────────────────────────────────────────────────────────── */
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:.7rem}
.metric{background:var(--plate);border:1px solid var(--rule-soft);border-radius:3px;padding:.85rem .9rem;box-shadow:var(--shadow)}
.metric .k{font-family:var(--mono);font-size:.63rem;letter-spacing:.13em;text-transform:uppercase;color:var(--text-faint);display:block;margin-bottom:.3rem}
.metric .v{font-family:var(--disp);font-weight:800;font-stretch:110%;font-size:1.75rem;line-height:1;font-variant-numeric:tabular-nums}
.metric .v small{font-family:var(--mono);font-size:.72rem;font-weight:400;color:var(--text-faint);letter-spacing:.04em}
.metric.pat .v{color:var(--patina)}
.metric.ret .v{color:var(--retreat)}
.metric.cop .v{color:var(--copper)}

/* ── Strength gauge ────────────────────────────────────────────────────── */
.gauge{height:10px;background:var(--recess);border:1px solid var(--rule);border-radius:2px;box-shadow:var(--press);overflow:hidden}
.gauge i{display:block;height:100%;background:linear-gradient(90deg,var(--copper-deep),var(--copper-lit));transition:width .5s ease}
.axis{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.65rem;color:var(--text-faint);margin-top:.35rem;letter-spacing:.06em}

/* ── Step chart ────────────────────────────────────────────────────────── */
.chart{width:100%;height:110px;display:block}
.chart .grid{stroke:var(--rule-soft);stroke-width:1}
.chart .line{fill:none;stroke:var(--copper);stroke-width:2;stroke-linejoin:miter}
.chart .cap{fill:var(--copper-lit)}

/* ── Log entries ───────────────────────────────────────────────────────── */
.entry{border-left:2px solid var(--rule);padding:.15rem 0 .15rem .85rem;margin-bottom:1rem}
.entry.through{border-left-color:var(--patina)}
.entry.back{border-left-color:var(--retreat)}
.entry.evi{border-left-color:var(--copper)}
.entry .when{font-family:var(--mono);font-size:.66rem;color:var(--text-faint);letter-spacing:.08em;text-transform:uppercase}
.entry p{margin:.2rem 0 0;font-size:.9rem;line-height:1.5}
.empty{color:var(--text-faint);font-size:.87rem;font-style:italic}

/* ── Library ───────────────────────────────────────────────────────────── */
.card{border-top:1px solid var(--rule-soft);padding:1.05rem 0}
.card:first-of-type{border-top:0;padding-top:.2rem}
.card h3{font-family:var(--disp);font-weight:700;font-stretch:108%;font-size:1.02rem;margin:0 0 .35rem;letter-spacing:-.005em}
.card p{margin:0 0 .5rem;font-size:.89rem;color:var(--text-dim);line-height:1.55}
.card .apply{font-size:.85rem;color:var(--text);border-left:2px solid var(--copper-deep);padding-left:.7rem}
.grouphead{
  font-family:var(--mono);font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--copper);margin:2rem 0 .2rem;padding-bottom:.4rem;border-bottom:1px solid var(--rule);
}
.grouphead:first-child{margin-top:0}

/* ── Banner ────────────────────────────────────────────────────────────── */
.banner{
  border:1px solid var(--copper-deep);background:rgba(196,133,75,.07);
  border-radius:3px;padding:.85rem 1rem;margin-bottom:1rem;
}
.banner p{margin:0;font-size:.87rem;line-height:1.5;color:var(--text)}
.banner .eyebrow{margin-bottom:.3rem}

/* ── Tab bar ───────────────────────────────────────────────────────────── */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:rgba(15,17,24,.94);backdrop-filter:blur(12px);
  border-top:1px solid var(--rule);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabs-inner{max-width:34rem;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{
  background:none;border:0;padding:.7rem .2rem .8rem;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:.28rem;color:var(--text-faint);
}
.tab svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tab span{font-family:var(--mono);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase}
.tab.on{color:var(--copper)}
.tab .dot{position:absolute}

hr.rule{border:0;border-top:1px solid var(--rule-soft);margin:1.4rem 0}
.hidden{display:none!important}
</style>
</head>
<body>

<!-- ══ SESSION OVERLAY ══════════════════════════════════════════════════ -->
<div class="session" id="session" role="dialog" aria-modal="true" aria-labelledby="s-angle">
  <div class="session-inner">
    <div class="spread">
      <p class="eyebrow dim" id="s-count">Impression</p>
      <button class="btn ghost sm" id="s-close" type="button">Leave</button>
    </div>
    <h2 class="angle" id="s-angle">Speak</h2>
    <p class="instruct" id="s-instruct"></p>
    <div class="statement big"><p class="txt" id="s-text"></p></div>
    <div id="s-timerwrap">
      <svg class="ring" id="s-ring" width="112" height="112" viewBox="0 0 112 112" aria-hidden="true">
        <circle class="track" cx="56" cy="56" r="50"></circle>
        <circle class="prog" cx="56" cy="56" r="50" transform="rotate(-90 56 56)"></circle>
        <text class="ring-num" x="56" y="62" id="s-num">60</text>
      </svg>
    </div>
    <div id="s-inputwrap" class="hidden">
      <textarea id="s-input" rows="5"></textarea>
      <p class="note" id="s-inputnote"></p>
    </div>
    <button class="btn primary wide" id="s-done" type="button" disabled>Hold it</button>
  </div>
</div>

<!-- ══ BUILD ════════════════════════════════════════════════════════════ -->
<section class="screen" id="screen-build">
  <div class="wrap">
    <div class="masthead"><h1>The Impression Engine</h1><span class="daycount" id="build-step-label">Step 1 / 6</span></div>
    <div class="rail" id="rail"></div>
    <div id="build-body"></div>
  </div>
</section>

<!-- ══ TODAY ════════════════════════════════════════════════════════════ -->
<section class="screen" id="screen-today">
  <div class="wrap">
    <div class="masthead"><h1>Today</h1><span class="daycount" id="today-day"></span></div>
    <div id="today-body"></div>
  </div>
</section>

<!-- ══ LOG ══════════════════════════════════════════════════════════════ -->
<section class="screen" id="screen-log">
  <div class="wrap">
    <div class="masthead"><h1>The Record</h1><span class="daycount" id="log-count"></span></div>
    <div id="log-body"></div>
  </div>
</section>

<!-- ══ PROGRESS ═════════════════════════════════════════════════════════ -->
<section class="screen" id="screen-progress">
  <div class="wrap">
    <div class="masthead"><h1>Reading</h1><span class="daycount" id="prog-day"></span></div>
    <div id="prog-body"></div>
  </div>
</section>

<!-- ══ LIBRARY ══════════════════════════════════════════════════════════ -->
<section class="screen" id="screen-library">
  <div class="wrap">
    <div class="masthead"><h1>The Law</h1><span class="daycount">Source material</span></div>
    <div id="lib-body"></div>
  </div>
</section>

<!-- ══ TABS ═════════════════════════════════════════════════════════════ -->
<nav class="tabs" id="tabs" aria-label="Sections">
  <div class="tabs-inner">
    <button class="tab" data-go="today" type="button"><svg viewBox="0 0 24 24"><path d="M12 3v18M5 8l7-5 7 5"/></svg><span>Today</span></button>
    <button class="tab" data-go="log" type="button"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M9 9h6M9 13h6M9 17h3"/></svg><span>Record</span></button>
    <button class="tab" data-go="progress" type="button"><svg viewBox="0 0 24 24"><path d="M4 18h4v-5H4zM10 18h4V8h-4zM16 18h4V4h-4z"/></svg><span>Reading</span></button>
    <button class="tab" data-go="library" type="button"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2z"/><path d="M9 3v18"/></svg><span>Law</span></button>
    <button class="tab" data-go="build" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg><span>Shift</span></button>
  </div>
</nav>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════
   THE IMPRESSION ENGINE
   Synthesis of three sources, implemented as a daily mechanism:
     · Bob Proctor — a paradigm is a multitude of habits in the subconscious.
       Two ways in: an emotional impact, or constant spaced repetition.
     · Price Pritchett, "You²" — the change is a discontinuous leap, and you
       behave your way into it. The method changes, not the effort level.
     · "Change Your Paradigm, Change Your Life" — results are the printout;
       the terror barrier is the edge of the old paradigm, not a stop sign.
   The engine multiplies the inner work by the outer work. Either at zero
   means the whole thing is at zero, and it says so.
   ═══════════════════════════════════════════════════════════════════════ */

/* ── Storage ───────────────────────────────────────────────────────────── */
const KEY = "impression-engine.v1";
const BLANK = {
  v: 1,
  shift: null,          // committed program
  draft: {},            // in-progress builder
  step: 0,
  slots: 5,
  days: {},             // dateKey -> day record
  evidence: [],
  failures: [],
  view: "build"
};
const clone = o => (typeof structuredClone === "function" ? structuredClone(o) : JSON.parse(JSON.stringify(o)));
let S = load();

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return clone(BLANK);
    const parsed = JSON.parse(raw);
    return Object.assign(clone(BLANK), parsed);
  }catch(e){ return clone(BLANK); }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ /* private mode */ }
}

/* ── Dates ─────────────────────────────────────────────────────────────── */
function key(d){
  const x = d || new Date();
  return x.getFullYear() + "-" + String(x.getMonth()+1).padStart(2,"0") + "-" + String(x.getDate()).padStart(2,"0");
}
function shiftDays(k, n){
  const [y,m,d] = k.split("-").map(Number);
  const x = new Date(y, m-1, d+n);
  return key(x);
}
function daysBetween(a, b){
  const pa = a.split("-").map(Number), pb = b.split("-").map(Number);
  return Math.round((Date.UTC(pb[0],pb[1]-1,pb[2]) - Date.UTC(pa[0],pa[1]-1,pa[2]))/86400000);
}
function prettyDate(k){
  const [y,m,d] = k.split("-").map(Number);
  return new Date(y,m-1,d).toLocaleDateString(undefined,{month:"short",day:"numeric"});
}
function today(){ return key(); }

/* ── Validation: the statement ─────────────────────────────────────────── */
function checkStatement(t){
  const s = String(t||"").trim();
  const out = [];
  if(!s) return out;
  const lower = " " + s.toLowerCase() + " ";
  const w = words(s).length;

  const hasI = /\bi\s+(am|have|earn|attract|close|serve|give|do|move|live|feel|choose|help|make|hold|receive)\b/i.test(s);
  out.push({ ok:hasI, msg: hasI
    ? "Stated in the present, first person."
    : 'Start from "I am" — or another present-tense "I" verb. It only accepts what is stated as already so.' });

  const future = /\b(will|going to|want to|wanting|hope|hoping|wish|someday|soon|try|trying|plan to|intend)\b/.test(lower);
  out.push({ ok:!future, msg: future
    ? '"Will", "want", "hope", "try" all file it under future. It stays there. Write it as done.'
    : "No future tense. It reads as fact." });

  const neg = /\b(not|never|no longer|don't|dont|doesn't|stop|quit|less|without|struggle|debt|broke|fail)\b/.test(lower);
  out.push({ ok:!neg, msg: neg
    ? "A negative still impresses the thing you named. Say what is, not what isn't."
    : "No negatives. Only the new picture." });

  const feel = /\b(grateful|thankful|happy|thrilled|love|joy|joyful|calm|free|proud|easy|easily|delighted|excited|peaceful|certain)\b/.test(lower);
  out.push({ ok:feel, msg: feel
    ? "Carries a feeling. That is the part that goes in."
    : "No feeling word anywhere. Repetition without emotion is recitation — name the feeling the result produces." });

  const lenOk = w >= 8 && w <= 45;
  out.push({ ok:lenOk, msg: lenOk
    ? w + " words — short enough to hold, long enough to picture."
    : (w < 8 ? "Too thin to feel. Give it enough detail that saying it produces a picture."
             : w + " words. Too long to say five times a day from memory. Cut it under 45.") });

  return out;
}
function checkGoal(t){
  const s = String(t||"").trim();
  const out = [];
  if(!s) return out;
  const lower = " " + s.toLowerCase() + " ";
  const incremental = /\b(more|better|improve|increase|grow a bit|a little|slightly|10%|20%|steady|consistent|keep)\b/.test(lower);
  out.push({ ok:!incremental, msg: incremental
    ? "This reads like an improvement on what you already do. That is an A-goal — it keeps the old method and asks for more effort. Go past what you know how to do."
    : "Not an improvement on the current method. Good — that is the point." });
  const specific = /\d/.test(s);
  out.push({ ok:specific, msg: specific
    ? "Has a number in it. It can be measured, so it can be missed, so it is real."
    : "No number. A goal you cannot measure cannot be missed, which means it cannot pull you." });
  const scary = words(s).length >= 5;
  out.push({ ok:scary, msg: scary ? "Specific enough to picture." : "Too vague to picture. Say exactly what the result looks like." });
  return out;
}

function daysToGoal(){
  if(!S.shift || !S.shift.goalDate) return "";
  const n = daysBetween(today(), S.shift.goalDate);
  if(n > 1) return n + " days left. You still do not know how. That is correct — commit first, the method shows up en route.";
  if(n === 1) return "Tomorrow.";
  if(n === 0) return "Today is the date.";
  return Math.abs(n) + " days past. Score it honestly in the record, then set the next one bigger, not smaller.";
}

function quietDays(){
  if(!S.shift) return 0;
  let n = 0;
  for(let i = 1; i <= 30; i++){
    const k = shiftDays(today(), -i);
    if(k < S.shift.committedAt) break;
    const rec = S.days[k];
    if(rec && rec.imp.length) break;
    n++;
  }
  return n;
}

  el("s-text").textContent = S.shift.statement;
  const doneBtn = el("s-done");

  if(angle.secs > 0){
    el("s-timerwrap").classList.remove("hidden");
    el("s-inputwrap").classList.add("hidden");
    const ring = el("s-ring").querySelector(".prog");
    const C = 2 * Math.PI * 50;

    el("s-num").textContent = angle.secs;
    doneBtn.disabled = true;
    doneBtn.textContent = "Hold it";
    sess.timer = setInterval(()=>{
      sess.left--;
      el("s-num").textContent = Math.max(0, sess.left);
      ring.style.strokeDashoffset = C * (1 - sess.left/angle.secs);
      if(sess.left <= 0){
        clearInterval(sess.timer); sess.timer = null;
        doneBtn.disabled = false;
        doneBtn.textContent = "Struck";
      }
    }, 1000);
  } else {
    el("s-timerwrap").classList.add("hidden");
    el("s-inputwrap").classList.remove("hidden");
    const ta = el("s-input");
    ta.value = "";
    ta.placeholder = angle.input;
    el("s-inputnote").textContent = angle.id === "write"
      ? "Recall it. Do not go back and copy it."
      : "This gets filed in the record as evidence.";
    doneBtn.disabled = true;
    doneBtn.textContent = "Struck";
    ta.oninput = () => { doneBtn.disabled = words(ta.value).length < 4; };
    setTimeout(()=>ta.focus(), 120);
  }
  el("session").classList.add("on");
}
function closeSession(complete){
  if(sess && sess.timer) clearInterval(sess.timer);
  if(complete && sess){
    const d = day();
    const angle = sess.angle;
    d.imp.push({ a: angle.id, at: new Date().toISOString() });
    if(angle.id === "prove"){
      const v = el("s-input").value.trim();
      if(v) S.evidence.unshift({ text:v, on: today() });
    }
    if(angle.id === "write"){
      const v = el("s-input").value.trim();
      const acc = similarity(v, S.shift.statement);
      if(acc < 0.6) S.evidence.unshift({ text:"Recall was rough — the statement is not in yet. Keep striking.", on: today(), sys:true });
    }
    save();
  }
  sess = null;
  el("session").classList.remove("on");
  if(complete){ renderToday(); flashLastStrike(); }
}
function flashLastStrike(){
  const marks = document.querySelectorAll("#tally .strike.hit");
  const last = marks[marks.length-1];
  if(last) last.classList.add("fresh");
}
function similarity(a,b){
  const A = new Set(words(a.toLowerCase().replace(/[^\w\s]/g,"")));
  const B = words(b.toLowerCase().replace(/[^\w\s]/g,""));
  if(!B.length) return 1;
  let hit = 0;
  B.forEach(w => { if(A.has(w)) hit++; });
  return hit / B.length;
}

/* ── Reading (progress) ────────────────────────────────────────────────── */
function stats(){
  const keys = Object.keys(S.days).sort();
  let imp = 0, leaps = 0, through = 0, back = 0, impDays = 0, swaps = 0, swapPoss = 0, fac = 0;
  keys.forEach(k=>{
    const d = S.days[k];
    imp += d.imp.length;
    if(d.imp.length) impDays++;
    if(d.leap) leaps++;
    if(d.faculty) fac++;
    if(d.terror){ d.terror.crossed ? through++ : back++; }
    d.swaps.forEach(x=>{ if(x) swaps++; });
    swapPoss += 3;
  });
  // streak of consecutive days with at least one impression, counting back from today
  let streak = 0;
  for(let i=0;i<400;i++){
    const k = shiftDays(today(), -i);
    const d = S.days[k];
    if(d && d.imp.length) streak++;
    else if(i > 0) break;
    else if(!d || !d.imp.length) continue; // today not yet done does not break it
  }
  let best = 0, run = 0, prev = null;
  keys.forEach(k=>{
    if(!S.days[k].imp.length){ run = 0; prev = k; return; }
    run = (prev && daysBetween(prev,k) === 1 && S.days[prev] && S.days[prev].imp.length) ? run+1 : 1;
    best = Math.max(best, run); prev = k;
  });

  const n = (S.shift && S.shift.slots) || S.slots;
  // Measure adherence over the program so far, capped at a 14-day lookback.
  // A fixed 14-day window would score a flawless day one at 7%, which is a lie.
  const win = Math.max(1, Math.min(14, programDay()));
  let impWin = 0, leapWin = 0;
  for(let i=0;i<win;i++){
    const d = S.days[shiftDays(today(), -i)];
    if(!d) continue;
    impWin += Math.min(d.imp.length, n);
    if(d.leap) leapWin++;
  }
  const inner = Math.min(1, impWin / (n*win));
  const outer = Math.min(1, leapWin / win);
  const strength = Math.round(100 * Math.sqrt(inner*outer));
  return { imp, leaps, through, back, impDays, swaps, swapPoss, fac, streak, best, inner, outer, strength, n, win };
}

function milestone(v, mark, text){
  const hit = v >= mark;
  return `<div class="task">

      <div class="task-sub">${esc(text)}</div>
    </div></div>`;
}

function stepChart(){
  const W = 320, H = 100, pad = 6;
  const days = 21;
  const vals = [];
  let run = 0;
  for(let i = days-1; i >= 0; i--){
    const d = S.days[shiftDays(today(), -i)];
    if(d && d.leap) run++;
    vals.push(run);
  }
  const max = Math.max(1, run);
  const x = i => pad + (i * (W - pad*2) / (days-1));
  const y = v => H - pad - (v/max) * (H - pad*2);
  let dstr = `M ${x(0)} ${y(vals[0])}`;
  for(let i=1;i<vals.length;i++){ dstr += ` L ${x(i)} ${y(vals[i-1])} L ${x(i)} ${y(vals[i])}`; }
  const grid = [0,.5,1].map(f=>`<line class="grid" x1="${pad}" y1="${pad + f*(H-pad*2)}" x2="${W-pad}" y2="${pad + f*(H-pad*2)}"/>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Cumulative out-of-character acts over the last 21 days: ${run} total">
    ${grid}<path class="line" d="${dstr}"/>
    <circle class="cap" cx="${x(days-1)}" cy="${y(run)}" r="3"/></svg>`;
}

/* ── Navigation ────────────────────────────────────────────────────────── */
function go(v){
  S.view = v; save();
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));
  el("screen-" + v).classList.add("on");
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on", t.dataset.go === v));
  window.scrollTo(0,0);
  render();
}
function render(){
  if(S.view === "build") renderBuild();
  else if(S.view === "today") renderToday();
  else if(S.view === "log") renderLog();
  else if(S.view === "progress") renderProgress();
  else if(S.view === "library") renderLibrary();
}

/* ── Events ────────────────────────────────────────────────────────────── */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-go],[data-nav],[data-act],[data-chip],[data-toggle]");
  if(!t) return;

  if(t.dataset.go){ go(t.dataset.go); return; }

  if(t.dataset.chip){
    const f = t.dataset.chip;
    S.draft[f] = (S.draft[f] === t.dataset.val) ? "" : t.dataset.val;
    save(); renderBuild(); return;
  }

  if(t.dataset.toggle){
    const d = day();
    if(t.dataset.toggle === "leap") d.leap = !d.leap;
    if(t.dataset.toggle === "faculty") d.faculty = !d.faculty;
    if(t.dataset.toggle === "swap"){ const i = +t.dataset.i; d.swaps[i] = !d.swaps[i]; }
    save(); renderToday(); return;
  }

  const nav = t.dataset.nav;
  if(nav === "back"){ S.step = Math.max(0, S.step-1); save(); renderBuild(); return; }
  if(nav === "next"){ S.step = Math.min(STEPS.length, S.step+1); save(); renderBuild(); return; }
  if(nav === "commit"){ commit(); return; }
  if(nav === "export"){ doExport(); return; }

  const act = t.dataset.act;
  if(act === "session"){ openSession(); return; }
  if(act === "terror"){
    const d = day();
    const note = (el("terror-note") && el("terror-note").value.trim()) || "";
    if(t.dataset.crossed === "none") d.terror = { crossed:true, note: note || "Did not reach the edge today. Worth asking whether the day was safe by accident or by design." };
    else d.terror = { crossed: t.dataset.crossed === "1", note };
    save(); renderToday(); return;
  }
  if(act === "terror-clear"){ day().terror = null; save(); renderToday(); return; }
  if(act === "evi-add"){
    const v = el("evi-in").value.trim();
    if(v){ S.evidence.unshift({ text:v, on: today() }); save(); renderLog(); }
    return;
  }
  if(act === "fail-add"){
    const v = el("fail-in").value.trim();
    if(v){ S.failures.unshift({ text:v, on: today() }); save(); renderLog(); }
    return;
  }
  if(act === "export"){ doExport(); return; }
  if(act === "import"){ el("import-file").click(); return; }
  if(act === "revise"){ S.step = 0; go("build"); return; }
});

/* Inputs: builder fields write to draft, day fields write to the day record */
document.addEventListener("input", e => {
  const f = e.target.dataset.f;
  if(!f) return;

  if(e.target.dataset.save === "day"){
    if(f === "leapNote"){ day().leapNote = e.target.value; save(); }
    return;
  }
  const d = S.draft;
  if(/^habit(\d)$/.test(f)){
    const i = +f.slice(5);
    d.habits = d.habits || ["","",""];
    d.habits[i] = e.target.value;
  } else if(/^swap(\d)(trigger|new)$/.test(f)){
    const m = f.match(/^swap(\d)(trigger|new)$/);
    d.swaps = d.swaps || [{},{},{}];
    d.swaps[+m[1]] = d.swaps[+m[1]] || {};
    d.swaps[+m[1]][m[2] === "trigger" ? "trigger" : "now"] = e.target.value;
  } else if(f === "slots"){
    S.slots = +e.target.value;
    if(S.shift) S.shift.slots = S.slots;
  } else {
    d[f] = e.target.value;
  }
  save();

  // live-validate the two authored fields without stealing focus
  if(f === "statement" || f === "goal"){
    const list = document.querySelector(".checks");
    if(list){
      const checks = f === "statement" ? checkStatement(e.target.value) : checkGoal(e.target.value);
      list.innerHTML = checks.map(c=>`<li class="${c.ok?"ok":""}">${esc(c.msg)}</li>`).join("");
    }
  }
  const btn = document.querySelector('[data-nav="next"]');
  if(btn && S.step < STEPS.length) btn.disabled = !STEPS[S.step].valid(S.draft);
});

});
el("s-done").addEventListener("click", () => closeSession(true));
el("s-close").addEventListener("click", () => closeSession(false));

/* ── Commit / data ─────────────────────────────────────────────────────── */
function commit(){
  const d = S.draft;
  const first = !S.shift;
  S.shift = {
    arena:d.arena, results:d.results, belief:d.belief, habits:d.habits,
    statement:d.statement.trim(), goal:d.goal.trim(), goalDate:d.goalDate,
    swaps:d.swaps, leap:d.leap.trim(), slots:S.slots,
    committedAt: first ? today() : S.shift.committedAt
  };
  save();
  go("today");
}
function doExport(){
  const blob = new Blob([JSON.stringify(S,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "impression-engine-" + today() + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
document.addEventListener("change", e => {
  if(e.target.id !== "import-file") return;
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const inc = JSON.parse(r.result);
      if(!inc || typeof inc !== "object") throw new Error("bad file");
      S = Object.assign(clone(BLANK), inc);
      save(); go(S.shift ? "today" : "build");
    }catch(err){
      alert("That file could not be read as a backup. Pick the JSON file the export produced.");
    }
  };
  r.readAsText(file);
});

/* ── Boot ──────────────────────────────────────────────────────────────── */
(function boot(){
  if(S.shift && S.view === "build" && S.step === 0) S.view = "today";
  if(!S.shift) S.view = "build";
  go(S.view);
})();
</script>
