<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F4F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mirror">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<title>Paradigm Mirror</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Zilla+Slab:wght@500;600;700&display=swap">
<style>
/* ── Tokens ──────────────────────────────────────────────────────────────
   Clinical paper, deep slate ink, one measuring teal. Light is the default,
   dark is designed rather than inverted. Every colour is a token so no rule
   is ever defined only inside a media block. */
:root{
  --paper:#F3F4F7; --card:#FFFFFF; --sunk:#EAECF1;
  --line:#D8DBE3; --line-soft:#E6E8EE;
  --ink:#16181D; --ink-2:#4A4F5C; --ink-3:#7B8090;
  --teal:#0F5257; --teal-lit:#177C84; --teal-wash:#E4EFEF; --teal-mark:#BFE0E0;
  --clay:#8A4B36; --clay-wash:#F6EAE5;
  --shadow:0 1px 2px rgba(22,24,29,.05), 0 6px 20px rgba(22,24,29,.05);
  --body:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --slab:"Zilla Slab",Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#101215; --card:#181B20; --sunk:#0B0D10; --line:#2B2F37; --line-soft:#22262D;
    --ink:#ECEEF2; --ink-2:#A8AEBB; --ink-3:#767C89;
    --teal:#5FBCC0; --teal-lit:#7FD3D6; --teal-wash:#132A2C; --teal-mark:#1D4447;
    --clay:#D89078; --clay-wash:#2A1A15;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --paper:#101215; --card:#181B20; --sunk:#0B0D10; --line:#2B2F37; --line-soft:#22262D;
  --ink:#ECEEF2; --ink-2:#A8AEBB; --ink-3:#767C89;
  --teal:#5FBCC0; --teal-lit:#7FD3D6; --teal-wash:#132A2C; --teal-mark:#1D4447;
  --clay:#D89078; --clay-wash:#2A1A15;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);
  font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal-lit);outline-offset:3px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wrap{max-width:36rem;margin:0 auto;padding:0 1.25rem}
.view{display:none}
.view.on{display:block}

.top{display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding:1.5rem 0 1rem;border-bottom:1px solid var(--line);margin-bottom:1.6rem}
.top h1{margin:0;font-weight:600;font-size:.76rem;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink-2)}
.top .meta{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
  font-variant-numeric:tabular-nums;white-space:nowrap}

h2.head{font-family:var(--slab);font-weight:700;font-size:1.9rem;line-height:1.15;
  margin:0 0 .6rem;text-wrap:balance;letter-spacing:-.01em}
h2.head.big{font-size:2.3rem}
h4.lbl{font-weight:600;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 .5rem}
p.lede{color:var(--ink-2);margin:0 0 1.2rem;font-size:1.02rem}
p.small{color:var(--ink-3);font-size:.85rem;line-height:1.55;margin:.6rem 0 0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;
  padding:.8rem 1.15rem;cursor:pointer;font-weight:500;font-size:.92rem;
  transition:border-color .14s ease,background .14s ease,transform .06s ease}
.btn:hover{border-color:var(--ink-3)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#0B1416}}
:root[data-theme="dark"] .btn.primary{color:#0B1416}
.btn.primary:hover{background:var(--teal-lit);border-color:var(--teal-lit)}
.btn.wide{width:100%}
.btn.quiet{background:transparent;border-color:transparent;color:var(--ink-3);padding-left:0;padding-right:0}
.btn.quiet:hover{color:var(--ink)}
.btn.sm{padding:.5rem .8rem;font-size:.83rem}
.btn[disabled]{opacity:.4;cursor:not-allowed}

.card{background:var(--card);border:1px solid var(--line-soft);border-radius:8px;
  box-shadow:var(--shadow);padding:1.35rem;margin-bottom:1.1rem}

/* ── The box ───────────────────────────────────────────────────────────── */
textarea.box{width:100%;min-height:9.5rem;background:var(--card);border:1px solid var(--line);
  border-radius:8px;padding:1.05rem 1.1rem;font-size:1.06rem;line-height:1.5;resize:vertical;
  box-shadow:var(--shadow);font-family:var(--body)}
textarea.box::placeholder{color:var(--ink-3)}
textarea.box:focus{border-color:var(--teal)}
.hintrow{display:flex;flex-wrap:wrap;gap:.4rem;margin:.8rem 0 1.1rem}
.hint{background:transparent;border:1px dashed var(--line);color:var(--ink-3);border-radius:100px;
  padding:.34rem .75rem;font-size:.82rem;cursor:pointer;text-align:left}
.hint:hover{border-style:solid;border-color:var(--teal);color:var(--teal)}

/* ── The result ────────────────────────────────────────────────────────── */
.verdict{font-family:var(--slab);font-weight:700;font-size:2.4rem;line-height:1.05;
  letter-spacing:-.02em;margin:0 0 .35rem;color:var(--teal);text-wrap:balance}
.conf{font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
  font-weight:600;margin:0 0 1.2rem}
.quoted{background:var(--sunk);border-radius:8px;padding:1.05rem 1.1rem;
  font-family:var(--slab);font-size:1.05rem;line-height:1.55;color:var(--ink-2)}
.quoted mark{background:var(--teal-mark);color:var(--ink);padding:.05em .18em;border-radius:3px}
.alts{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.7rem}
.alts button{background:var(--card);border:1px solid var(--line);border-radius:100px;
  padding:.4rem .85rem;font-size:.85rem;cursor:pointer;color:var(--ink-2)}
.alts button:hover{border-color:var(--teal);color:var(--teal)}

.section{margin-bottom:1.5rem}
.section p{margin:0 0 .6rem}
.section p:last-child{margin-bottom:0}
.voice{border-left:2px solid var(--line);padding-left:1rem;margin:0}
.voice p{font-family:var(--slab);font-weight:500;font-size:1.02rem;color:var(--ink-2);
  margin:0 0 .35rem;line-height:1.4}
.voice p:last-child{margin-bottom:0}
ul.costs{margin:0;padding-left:1.15rem}
ul.costs li{margin-bottom:.4rem;color:var(--ink-2)}
.tell{background:var(--clay-wash);border-radius:6px;padding:.95rem 1.1rem}
.tell p{margin:0;color:var(--clay);font-weight:500}
.move{background:var(--teal-wash);border-radius:6px;padding:1.1rem 1.15rem}
.move .when{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);
  font-weight:600;display:block;margin-bottom:.4rem}
.move p{margin:0;font-family:var(--slab);font-weight:600;font-size:1.12rem;line-height:1.35;color:var(--ink)}
.swap{border:1px dashed var(--line);border-radius:6px;padding:1rem 1.1rem}
.swap p{margin:0;font-family:var(--slab);font-weight:600;font-size:1.08rem;line-height:1.35}

/* ── The pattern: an eye chart built from what you actually typed ──────── */
.chart{margin:0 0 1rem;padding:0;list-style:none}
.chart li{border-bottom:1px solid var(--line-soft)}
.chart li:last-child{border-bottom:0}
.chart button{width:100%;background:none;border:0;padding:.85rem 0;cursor:pointer;
  display:flex;align-items:baseline;justify-content:space-between;gap:1rem;text-align:left}
.chart .nm{font-family:var(--slab);font-weight:700;line-height:1.1;letter-spacing:-.02em;color:var(--ink)}
.chart .pc{font-size:.76rem;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.chart .r1 .nm{font-size:2.4rem}.chart .r2 .nm{font-size:2rem}.chart .r3 .nm{font-size:1.66rem}
.chart .r4 .nm{font-size:1.4rem}.chart .r5 .nm{font-size:1.2rem}.chart .r6 .nm{font-size:1.05rem}
.chart .r7 .nm{font-size:.95rem}.chart .r8 .nm{font-size:.88rem}
.chart .loud .nm{color:var(--teal)}
.chart .none .nm{color:var(--ink-3)}
.chart button:hover .nm{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.legend{display:flex;justify-content:space-between;font-size:.74rem;color:var(--ink-3);
  letter-spacing:.08em;text-transform:uppercase;padding-top:.6rem;border-top:1px solid var(--line)}

.entry{border-left:2px solid var(--line-soft);padding:.1rem 0 .1rem .9rem;margin-bottom:1.05rem}
.entry .when{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.entry .tag{color:var(--teal);font-weight:600}
.entry p{margin:.2rem 0 0;font-size:.94rem;color:var(--ink-2);line-height:1.5}

.hidden{display:none!important}
a.plain{color:var(--teal);text-decoration:underline;text-underline-offset:3px}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);z-index:20}
.dock-inner{max-width:36rem;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.dock button{background:none;border:0;padding:.85rem .3rem .95rem;cursor:pointer;font-size:.72rem;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.dock button.on{color:var(--teal);box-shadow:inset 0 2px 0 var(--teal)}
</style>
</head>
<body>

<section class="view" id="v-type"><div class="wrap">
  <div class="top"><h1>Paradigm Mirror</h1><span class="meta" id="type-meta"></span></div>
  <div id="type-body"></div>
</div></section>

<section class="view" id="v-result"><div class="wrap">
  <div class="top"><h1>Identified</h1><button class="btn quiet" data-act="new">Type another</button></div>
  <div id="result-body"></div>
</div></section>

<section class="view" id="v-read"><div class="wrap">
  <div class="top"><h1 id="read-top">Reading</h1><button class="btn quiet" data-act="back">Back</button></div>
  <div id="read-body"></div>
</div></section>

<section class="view" id="v-pattern"><div class="wrap">
  <div class="top"><h1>Pattern</h1><span class="meta" id="pattern-meta"></span></div>
  <div id="pattern-body"></div>
</div></section>

<section class="view" id="v-about"><div class="wrap">
  <div class="top"><h1>What this is</h1><span class="meta">Read once</span></div>
  <div id="about-body"></div>
</div></section>

<nav class="dock" aria-label="Sections"><div class="dock-inner">
  <button data-go="type" type="button">Type</button>
  <button data-go="pattern" type="button">Pattern</button>
  <button data-go="about" type="button">About</button>
</div></nav>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════
   PARADIGM MIRROR

   You type what is actually happening, in your own words, and it names the
   paradigm underneath it — then shows you the exact words in your sentence
   that gave it away.

   That last part is the whole app. Proctor's order puts awareness first, and
   a paradigm is only ever visible in the language it produces. Seeing your
   own phrasing marked up is the awareness; the reading tells you what it
   costs and the one move that changes it.

   The matcher is weighted pattern matching over your own text. It runs
   entirely on the device, works with no signal, and is honest about being a
   mirror rather than a diagnosis — when it is unsure it says so and asks.
   ═══════════════════════════════════════════════════════════════════════ */

const KEY = "paradigm-mirror.v2";

const P = [
  {
    id:"enough", name:"Never Enough",
    means:"You are running as if supply is finite and about to end — of money, time, leads, chances. It is not pessimism. It is a nervous system that learned the shape of running out.",
    voice:["There is never quite enough, however much comes in.","If they get it, that is one fewer for me.","I hold on to what I have rather than spend it on growing."],
    from:"Almost always watched an adult run out of something before you were seven. You learned the feeling before you had words for it, so it does not present as a belief. It presents as realism.",
    costs:["You underprice, and you take the first number offered.","You chase every lead badly instead of the right one well.","You will not spend on the thing that would grow the business."],
    tell:"The tightening in your chest a half-second before you name a number.",
    when:"you feel yourself about to lower a number",
    move:"Say the original number out loud, then stop talking. Let the silence sit.",
    swap:"There is more where this came from, and my job is to go and get it."
  },
  {
    id:"deserve", name:"I Don't Deserve It",
    means:"Underneath, you do not believe you have earned the right to be paid well or to want more. This is self-image, and self-image sets a ceiling results cannot stay above for long.",
    voice:["Some part of me thinks I do not really deserve this.","When it goes well it was luck more than me.","I quietly expect to be found out."],
    from:"Built out of how you were treated, not out of anything you did. Self-image forms from other people's behaviour toward you, mostly before you were old enough to evaluate it. None of that is your fault; all of it is now yours to work with.",
    costs:["You apologise inside your own messages before you ask for anything.","You discount before anyone asks you to.","You over-deliver to justify being paid at all, and a win leaves you uneasy rather than pleased."],
    tell:"The word “just”. Just checking in, just wondering, just wanted to ask. That word is the paradigm talking.",
    when:"you catch the word “just” in something you are about to send",
    move:"Delete it and send the sentence without it. Do not soften anything else to compensate.",
    swap:"I am paid for the result I produce, and the result is good."
  },
  {
    id:"hurt", name:"It Has To Hurt",
    means:"You believe money is only legitimate if it cost you suffering. So easy money feels wrong, and you find ways to make it expensive.",
    voice:["If the work was easy, it does not really count.","However much I did today, I should have done more.","Resting when the work is finished still feels like getting away with something."],
    from:"You were praised for effort rather than outcome, or you watched someone exhaust themselves and were taught to read that as love.",
    costs:["You pick the hard low-value task over the easy high-value one.","You measure the day in hours worked instead of in leases signed.","You quietly resent the work, and it leaks into how you talk to people."],
    tell:"Choosing the harder task when a faster one pays more.",
    when:"you are about to start a long task",
    move:"Ask out loud: is there a ten-minute version of this? Do that one first, and only continue if it is still needed.",
    swap:"I am paid for results, and the easy results count the most."
  },
  {
    id:"liked", name:"Be Liked First",
    means:"You need warmth in place before you will ask for anything, so you keep trading the ask away to keep the warmth.",
    voice:["I would rather wait for them to bring it up than push.","I do not want to be a bother.","Being liked matters more to me than being direct."],
    from:"Somewhere early, being liked was how you stayed safe. It worked, which is why it is still running.",
    costs:["You send friendly messages that contain no actual request.","You let a client go quiet rather than chase them.","You accept a worse split rather than seem difficult."],
    tell:"A message you are about to send that has no question and no ask in it.",
    when:"you finish writing a message and before you send it",
    move:"Find the ask. If there is not one, add it. If it is already there, do not soften it.",
    swap:"The ask is the service. People are relieved when someone is direct."
  },
  {
    id:"ready", name:"Not Ready Yet",
    means:"You treat preparing as progress. It is the most respectable available form of not starting, because it looks exactly like work.",
    voice:["I need to get set up properly before I really start.","I should learn more about this first.","I would rather get it right than get it out."],
    from:"Preparation was safe. Being seen unprepared was not. So you got very good at the safe half.",
    costs:["You build the tracker instead of making the call.","You research instead of sending the message.","Your busiest days produce nothing anyone could reply to."],
    tell:"You are organising something instead of talking to someone.",
    when:"you notice you are building, tidying or researching",
    move:"Stop mid-task and send one message to one real person. Then go back to it if you still want to.",
    swap:"I begin at once, whether I am ready or not."
  },
  {
    id:"small", name:"Stay Small",
    means:"You hold yourself under a size where you would be noticed, judged, or expected to keep it up.",
    voice:["I would rather not put myself out there.","I play down good news when I share it.","I do not want to become one of those people who promotes themselves."],
    from:"Visibility cost you something once. Shrinking worked, and nothing has told your nervous system the danger has passed.",
    costs:["You do not post, so the people looking for you cannot find you.","You dilute your own wins in the telling.","Your pipeline stays exactly the size of your comfort."],
    tell:"About to share something and finding yourself softening it, hedging it, or deleting it.",
    when:"you catch yourself softening something before you post or send it",
    move:"Send the unsoftened version. Do not read it again first.",
    swap:"Being seen is how the people who need me find me."
  },
  {
    id:"fade", name:"I Always Fade",
    means:"You expect your own follow-through to run out, so you never build on anything. The prediction is what causes the fade, not the other way round.",
    voice:["I start strong and then lose steam. That is just how I am.","There is not much point starting, I will drop it like the last one.","I would rather begin something new than finish the last thing."],
    from:"A few early failures got generalised into an identity. The evidence was thin; the conclusion was total.",
    costs:["You stop following up after one silence.","You abandon a working system on day four.","You keep starting, so nothing ever compounds."],
    tell:"Day three or four of anything, and that specific flat feeling that says here we go again.",
    when:"you feel the day-three flatness arrive",
    move:"Do the smallest possible version of the thing, badly, and mark it done. Not a good version. A done one.",
    swap:"I do not need to feel like it. I only need to do the small version."
  },
  {
    id:"taken", name:"It Gets Taken",
    means:"You brace for loss, so you never fully land in a good result. Bracing feels like being sensible. It is a paradigm.",
    voice:["When things go well I start waiting for something to go wrong.","I do not let myself get comfortable.","Good things do not tend to last for me."],
    from:"Something good was removed suddenly and early. Bracing was accurate then. It is running now on a threat that has passed.",
    costs:["You do not celebrate a signed lease, so nothing ever feels like progress.","You over-check things that are fine and call it being careful.","Your anxiety rises when things go well, which teaches you to keep them small."],
    tell:"Something good happens and you immediately start scanning for the catch.",
    when:"something good lands",
    move:"Write it down in one sentence and read it out loud. Do nothing else with it — no checking, no bracing.",
    swap:"I am allowed to keep this, and I can get more."
  }
];
function byId(id){ return P.find(x => x.id === id); }

/* ── The matcher ────────────────────────────────────────────────────────
   Weighted phrase patterns over the user's own words. 3 = unmistakable,
   2 = strong, 1 = suggestive. Score is the sum of DISTINCT patterns hit, so
   one repeated word cannot run away with it. Overlapping human language is
   real, so overlaps are allowed and weighted toward the better fit. */
const SIG = {
  enough: [
    [3,"can'?t afford|cannot afford|too expensive|out of my budget"],
    [3,"there'?s never enough|never enough money|not enough money|no money"],
    [3,"running out|ran out|run out of"],
    [3,"lowball|low ?balled|knocked me down|talked me down"],
    [2,"broke|skint|behind on (the )?(rent|bills|payments)|bills? (are|is) due"],
    [2,"discount|knock (it|something) off|cut (my|the) (fee|rate|price|commission)"],
    [2,"lowered? (my|the) (price|rate|fee|number)|dropped (my|the) (price|rate|fee)"],
    [2,"took the first (offer|number)|settled for|had to take (it|whatever)"],
    [2,"slow month|dry|no leads|nothing coming in|pipeline is empty"],
    [2,"someone else got|they went with someone|lost (it|the deal) to"],
    [2,"scraping|barely (making|covering|enough)|paycheck to paycheck"],
    [2,"can'?t (afford to|justify) spend"],
    [1,"tight|expensive|cheaper|save money|waste of money|too much money"],
    [1,"only made|only got|just enough"]
  ],
  deserve: [
    [3,"don'?t deserve|do not deserve|undeserving|not worthy"],
    [3,"who am i to|what right do i have"],
    [3,"imposter|impostor|fraud|a fake|found out|figure out i'?m not"],
    [3,"not good enough|not worth (it|that|what)"],
    [2,"embarrassed|ashamed|humiliat|cringed at myself"],
    [2,"felt (bad|guilty|awful) (about )?(asking|charging|invoicing|billing)"],
    [2,"i was (just )?lucky|got lucky|a fluke|right place right time"],
    [2,"shouldn'?t (be able to|get to|have) ask"],
    [2,"apologis|apologiz|said sorry|kept saying sorry"],
    [2,"over ?deliver|did extra to make up|worked extra to justify"],
    [1,"\\bjust (checking|wondering|wanted|following|seeing|asking|thought)"],
    [1,"sorry to|so sorry|stupid of me|my fault"]
  ],
  hurt: [
    [3,"burn(t|ed) out|burnout|running on empty|nothing left in the tank"],
    [3,"worked (all day|all night|the whole|every)|been at (it|this) (all|since)"],
    [3,"should have done more|didn'?t do enough|haven'?t done enough"],
    [2,"exhaust|shattered|wiped|drained|dead on my feet"],
    [2,"no break|didn'?t (take a break|stop|eat)|haven'?t stopped"],
    [2,"feel(s)? lazy|being lazy|slacking|not working hard enough"],
    [2,"guilty (about )?(resting|stopping|taking|a day off|the day off)"],
    [2,"grind|hustle|graft|flat out|back to back"],
    [2,"felt too easy|was too easy|shouldn'?t be this easy|didn'?t feel earned"],
    [1,"\\d+ hours|all weekend|since 5 ?am|since six|late again|tired"],
    [1,"wasted the (day|morning|afternoon)|nothing to show for"]
  ],
  liked: [
    [3,"don'?t want to (be a )?bother|not want to bother|hate bothering"],
    [3,"come across as (pushy|rude|desperate|aggressive|annoying)|seem (pushy|rude|desperate|aggressive)"],
    [3,"don'?t want to (push|pester|nag|chase|hassle|bug)"],
    [3,"what will they think|they'?ll think i'?m|worried what they think"],
    [2,"annoying|pushy|nagging|pestering|too much|being a pain"],

/* Compile once. Word-ish boundaries keep "just" from matching "adjust". */
const COMPILED = {};
Object.keys(SIG).forEach(k => {
  COMPILED[k] = SIG[k].map(r => [r[0], new RegExp("(?:^|[^a-z])(" + r[1] + ")", "gi")]);
});

function analyse(text){
  const out = P.map(p => {
    let score = 0;
    const hits = [];
    (COMPILED[p.id] || []).forEach(pair => {
      const w = pair[0], re = new RegExp(pair[1].source, "gi");
      let m, found = false, guard = 0;
      while((m = re.exec(text)) !== null && guard++ < 200){
        const g = m[1];
        if(g && g.trim()){
          const s = m.index + m[0].indexOf(g);
          hits.push({ s, e: s + g.length });
          found = true;
        }
        if(m.index === re.lastIndex) re.lastIndex++;
      }
      if(found) score += w;
    });
    return { p, score, hits };
  });
  out.sort((a,b) => b.score - a.score || P.indexOf(a.p) - P.indexOf(b.p));
  return out;
}
function confidence(res){
  const top = res[0], gap = top.score - (res[1] ? res[1].score : 0);
  if(top.score >= 6 && gap >= 2) return { k:"clear", t:"Clear read" };
  if(top.score >= 4) return { k:"likely", t:"Most likely" };
  if(top.score >= 2) return { k:"maybe", t:"Best guess — check it" };
  return { k:"none", t:"No clear read" };
}
/* Merge overlapping spans so the marked-up quote never nests tags. */
function highlight(text, hits){
  if(!hits.length) return esc(text);
  const sorted = hits.slice().sort((a,b) => a.s - b.s);
  const merged = [];
  sorted.forEach(h => {
    const last = merged[merged.length-1];
    if(last && h.s <= last.e) last.e = Math.max(last.e, h.e);
    else merged.push({ s:h.s, e:h.e });
  });
  let out = "", at = 0;
  merged.forEach(m => {
    out += esc(text.slice(at, m.s)) + "<mark>" + esc(text.slice(m.s, m.e)) + "</mark>";
    at = m.e;
  });
  return out + esc(text.slice(at));
}

/* ── State ─────────────────────────────────────────────────────────────── */
const BLANK = { v:2, entries:[], draft:"", view:"type", openId:null, lastId:null, seenAbout:false };
let S = load();
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) return Object.assign(JSON.parse(JSON.stringify(BLANK)), JSON.parse(raw));
    /* Carry the catch counts over from the quiz version if it is there. */
    const old = localStorage.getItem("paradigm-mirror.v1");
    const seed = JSON.parse(JSON.stringify(BLANK));
    if(old){ try{ seed.seenAbout = !!JSON.parse(old).scanned; }catch(e){} }
    return seed;
  }catch(e){ return JSON.parse(JSON.stringify(BLANK)); }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function el(id){ return document.getElementById(id); }
function words(s){ return String(s||"").trim().split(/\s+/).filter(Boolean); }
function stamp(){
  const d = new Date();
  return { on: d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"),
           at: d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}) };
}
function pretty(k){
  const p = String(k).split("-").map(Number);
  return new Date(p[0],p[1]-1,p[2]).toLocaleDateString(undefined,{month:"short",day:"numeric"});
}
function counts(){
  const c = {};
  P.forEach(p => c[p.id] = 0);
  S.entries.forEach(e => { if(c[e.id] != null) c[e.id]++; });
  return c;
}

/* ── Type ──────────────────────────────────────────────────────────────── */
const PROMPTS = [
  "A client went quiet and I don't know what to send",
  "I've rewritten this message four times",
  "I was about to lower my price",
  "I didn't post the thing I wrote",
  "It's going well and I feel sick about it",
  "I've done nothing all day but organise"
];
function renderType(){
  const recent = S.entries.slice(0,3);
  el("type-meta").textContent = S.entries.length ? S.entries.length + " logged" : "";
  el("type-body").innerHTML = `
    <h2 class="head big">What's happening?</h2>
    <p class="lede">Type it however it comes out — messy, mid-thought, one line or ten. It reads your actual words and names the paradigm underneath, then shows you which words gave it away.</p>
    <textarea class="box" id="box" placeholder="I keep rewriting this message to the leasing office and I still haven't sent it…">${esc(S.draft||"")}</textarea>
    <div class="hintrow">${PROMPTS.map(t => `<button type="button" class="hint" data-prompt="${esc(t)}">${esc(t)}</button>`).join("")}</div>
    <button class="btn primary wide" data-act="identify" id="go" ${words(S.draft).length >= 3 ? "" : "disabled"}>Identify it</button>
    <p class="small">Nothing leaves this device. It works with no signal.</p>
    ${recent.length ? `<div style="margin-top:2.2rem">
      <h4 class="lbl">Recent</h4>
      ${recent.map(e => `<div class="entry"><span class="when">${esc(pretty(e.on))} ${esc(e.at)} · <span class="tag">${esc(byId(e.id) ? byId(e.id).name : "—")}</span></span>
        <p>${esc(e.text.length > 130 ? e.text.slice(0,130) + "…" : e.text)}</p></div>`).join("")}
      <button class="btn quiet" data-go="pattern">See the pattern</button></div>` : ""}`;
}

/* ── Result ────────────────────────────────────────────────────────────── */
function renderResult(){
  const e = S.entries.find(x => x.key === S.lastId);
  if(!e){ go("type"); return; }
  const res = analyse(e.text);
  const chosen = res.find(r => r.p.id === e.id) || res[0];
  const conf = e.corrected ? { k:"clear", t:"You picked this" } : confidence(res);
  const p = chosen.p;
  /* On a no-read the "top" is arbitrary at score zero, so offer all eight
     rather than silently withholding one. */
  const alts = conf.k === "none" ? res.slice() : res.filter(r => r.p.id !== p.id).slice(0, 3);

  el("result-body").innerHTML = `
    ${conf.k === "none" ? `
      <h2 class="head">Nothing jumped out.</h2>
      <p class="lede">Your wording did not match anything strongly, which happens — and is not a failure of yours. Read the eight and pick the one that lands. Recognising it yourself is worth more than the app guessing right.</p>
    ` : `
      <p class="conf">${esc(conf.t)}</p>
      <h2 class="verdict">${esc(p.name)}</h2>
      <p class="lede">${esc(p.means)}</p>
      <div class="section">
        <h4 class="lbl">${e.corrected ? "What you wrote" : "The words that gave it away"}</h4>
        <div class="quoted">${e.corrected ? esc(e.text) : highlight(e.text, chosen.hits)}</div>
        ${e.corrected ? "" : '<p class="small">Those are your words, not the app\'s. A paradigm is only ever visible in the language it produces — seeing your own phrasing marked up is the awareness.</p>'}
      </div>
      <div class="section">
        <h4 class="lbl">The tell — how to catch it next time</h4>
        <div class="tell"><p>${esc(p.tell)}</p></div>
      </div>
      <div class="section">
        <h4 class="lbl">Do this with what you just typed</h4>
        <div class="move"><span class="when">When ${esc(p.when)}</span><p>${esc(p.move)}</p></div>
      </div>
      <div class="section">
        <h4 class="lbl">Say this instead</h4>
        <div class="swap"><p>${esc(p.swap)}</p></div>
      </div>
      <button class="btn wide" data-open="${p.id}">Read all of ${esc(p.name)}</button>
    `}
    <div class="section" style="margin-top:1.6rem">
      <h4 class="lbl">${conf.k === "none" ? "Pick the one that fits" : "Not that one?"}</h4>
      <div class="alts">${alts.map(r => `<button type="button" data-correct="${r.p.id}">${esc(r.p.name)}</button>`).join("")}</div>
      <p class="small">Correcting it is not a failure of the app. Naming it yourself is the stronger version of the same move, and it teaches the pattern list what your language actually looks like.</p>
    </div>
    <button class="btn primary wide" data-act="new" style="margin-top:.8rem">Type another</button>
    <button class="btn quiet" data-act="delete-last" style="margin-top:.4rem">Delete this entry</button>`;
}

/* ── Reading ───────────────────────────────────────────────────────────── */
function renderRead(){
  const p = byId(S.openId);
  if(!p){ go("type"); return; }
  const n = counts()[p.id] || 0;
  el("read-top").textContent = n ? n + (n === 1 ? " time" : " times") : "Reading";
  el("read-body").innerHTML = `
    <h2 class="head">${esc(p.name)}</h2>
    <p class="lede">${esc(p.means)}</p>
    <div class="section"><h4 class="lbl">How it sounds in your head</h4>
      <div class="voice">${p.voice.map(t => `<p>${esc(t)}</p>`).join("")}</div></div>
    <div class="section"><h4 class="lbl">Where it came from</h4><p>${esc(p.from)}</p></div>
    <div class="section"><h4 class="lbl">What it is costing you</h4>
      <ul class="costs">${p.costs.map(t => `<li>${esc(t)}</li>`).join("")}</ul></div>
    <div class="section"><h4 class="lbl">The tell — how to catch it</h4>
      <div class="tell"><p>${esc(p.tell)}</p></div></div>
    <div class="section"><h4 class="lbl">The one move</h4>
      <div class="move"><span class="when">When ${esc(p.when)}</span><p>${esc(p.move)}</p></div>
      <p class="small">One move, not a list. A list is something to read; this is something to do. It is written as when-then on purpose — deciding the trigger in advance is the difference between an intention and an action.</p></div>
    <div class="section"><h4 class="lbl">Say this instead</h4>
      <div class="swap"><p>${esc(p.swap)}</p></div></div>
    ${n ? `<p class="small">You have logged this one ${n} ${n===1?"time":"times"}.</p>` : ""}
    <button class="btn quiet" data-act="back" style="margin-top:1rem">Back</button>`;
}

/* ── Pattern ───────────────────────────────────────────────────────────── */
function renderPattern(){
  const c = counts();
  const total = S.entries.length;
  el("pattern-meta").textContent = total ? total + (total === 1 ? " entry" : " entries") : "";
  if(!total){
    el("pattern-body").innerHTML = `<h2 class="head">Nothing to see yet.</h2>
      <p class="lede">Type a few real situations and this becomes a picture of which paradigms actually run your days — built from what happened to you, not from a questionnaire about yourself.</p>
      <button class="btn primary wide" data-go="type">Type something</button>`;
    return;
  }
  const rank = P.map(p => ({ p, n:c[p.id] })).sort((a,b) => b.n - a.n);
  const max = Math.max(1, rank[0].n);
  const top = rank[0];
  el("pattern-body").innerHTML = `
    <h2 class="head">Loudest first.</h2>
    <p class="lede">Built from the ${total} ${total===1?"situation":"situations"} you have typed in. Read it like an eye chart, except the line you cannot ignore is the big one. Tap any of them.</p>
    <ul class="chart">
      ${rank.map((x,i) => `<li class="r${i+1} ${x.n === max && x.n > 0 ? "loud" : (x.n === 0 ? "none" : "")}">
        <button type="button" data-open="${x.p.id}">
          <span class="nm">${esc(x.p.name)}</span>
          <span class="pc">${x.n === 0 ? "—" : x.n}</span></button></li>`).join("")}
    </ul>
    <div class="legend"><span>Comes up most</span><span>Not yet</span></div>
    ${top.n > 0 ? `<div class="card" style="margin-top:1.75rem">
      <h4 class="lbl">Where to put your attention</h4>
      <p style="margin:0 0 .7rem"><strong>${esc(top.p.name)}</strong> is the one showing up most in what you actually type. ${esc(top.p.tell)}</p>
      <p style="margin:0;color:var(--ink-2)">Work one at a time. Trying to catch all eight at once is how none of them get caught.</p>
      <button class="btn wide" data-open="${top.p.id}" style="margin-top:1rem">Read ${esc(top.p.name)}</button></div>` : ""}
    <h4 class="lbl" style="margin-top:2rem">Everything you have typed</h4>
    ${S.entries.slice(0,40).map(e => `<div class="entry">
      <span class="when">${esc(pretty(e.on))} ${esc(e.at)} · <span class="tag">${esc(byId(e.id) ? byId(e.id).name : "—")}</span>${e.corrected ? " · you named it" : ""}</span>
      <p>${esc(e.text.length > 220 ? e.text.slice(0,220) + "…" : e.text)}</p></div>`).join("")}
    ${S.entries.length > 40 ? `<p class="small">Showing the last 40 of ${S.entries.length}.</p>` : ""}
    <button class="btn quiet" data-act="clear" style="margin-top:1.2rem">Clear everything</button>`;
}

/* ── About ─────────────────────────────────────────────────────────────── */
function renderAbout(){
  el("about-body").innerHTML = `
    <h2 class="head">You are not choosing most of this.</h2>
    <p class="lede">A paradigm is a bundle of beliefs and habits sitting in your subconscious. Most of it went in before you were seven, absorbed from the people around you — you did not pick it and you were never asked. It then decides roughly 95% of what you do, silently, all day.</p>
    <p class="lede">That is why willpower keeps losing. You are not arguing with a decision. You are arguing with a default.</p>
    <p class="lede">You cannot change what you cannot see, which is the only thing this app does. Type what is happening, and it names the paradigm underneath and marks the words in your own sentence that gave it away. Then it gives you the tell, one move, and the line to say instead.</p>
    <h4 class="lbl" style="margin-top:2rem">How the identifying works</h4>
    <p class="lede">Weighted pattern matching over your own language, running entirely on this device. It is a mirror, not a diagnosis, and it is deliberately loud about being unsure — when nothing matches strongly it says so and asks you to pick instead. Correcting it is the better version of the same move: recognising it yourself is the point.</p>
    <h4 class="lbl" style="margin-top:2rem">The eight</h4>
    <ul class="costs">${P.map(p => `<li><strong>${esc(p.name)}</strong> — ${esc(p.means.split(".")[0])}.</li>`).join("")}</ul>
    <p class="small" style="margin-top:2rem">Built on Bob Proctor's model of paradigms and his order of operations, in which awareness moves first. If you want the doing side — impressing a replacement paradigm daily, the terror barrier, the goal arithmetic — that is <a class="plain" href="../index.html">The Impression Engine</a>. This app shows you what to point it at.</p>
    <p class="small">This is belief and behaviour work, not treatment for trauma. If the childhood material itself becomes the loud part rather than the pattern, that needs a person, not an app.</p>`;
}

/* ── Navigation ────────────────────────────────────────────────────────── */
const VIEWS = ["type","result","read","pattern","about"];
function go(v){
  S.view = v; save();
  document.querySelectorAll(".view").forEach(x => x.classList.remove("on"));
  const t = el("v-" + v);
  if(t) t.classList.add("on");
  document.querySelectorAll(".dock button").forEach(b => b.classList.toggle("on",
    b.dataset.go === v || (v === "result" && b.dataset.go === "type") || (v === "read" && b.dataset.go === "pattern")));
  window.scrollTo(0,0);
  render();
}
function render(){
  if(S.view === "type") renderType();
  else if(S.view === "result") renderResult();
  else if(S.view === "read") renderRead();
  else if(S.view === "pattern") renderPattern();
  else if(S.view === "about") renderAbout();
}

function identify(){
  const text = (el("box") ? el("box").value : S.draft || "").trim();
  if(words(text).length < 3) return;
  const res = analyse(text);
  const conf = confidence(res);
  const s = stamp();
  const entry = { key:"e" + Date.now().toString(36), on:s.on, at:s.at, text,
                  id: conf.k === "none" ? null : res[0].p.id, corrected:false };
  S.entries.unshift(entry);
  S.lastId = entry.key;
  S.draft = "";
  save();
  go("result");
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-go],[data-act],[data-open],[data-correct],[data-prompt]");
  if(!t) return;

  if(t.dataset.go){ go(t.dataset.go); return; }
  if(t.dataset.prompt){
    const box = el("box");
    if(box){ box.value = t.dataset.prompt; S.draft = box.value; save();
      el("go").disabled = false; box.focus(); }
    return;
  }
  if(t.dataset.open){ S.openId = t.dataset.open; save(); go("read"); return; }
  if(t.dataset.correct){
    const en = S.entries.find(x => x.key === S.lastId);
    if(en){ en.id = t.dataset.correct; en.corrected = true; save(); renderResult(); }
    return;
  }

  const a = t.dataset.act;
  if(a === "identify"){ identify(); return; }
  if(a === "new"){ S.draft = ""; save(); go("type"); setTimeout(() => { const b = el("box"); if(b) b.focus(); }, 60); return; }
  if(a === "back"){ go(S.entries.length ? "pattern" : "type"); return; }
  if(a === "delete-last"){
    S.entries = S.entries.filter(x => x.key !== S.lastId);
    S.lastId = null; save(); go("type"); return;
  }
  if(a === "clear"){
    if(confirm("Delete every entry? This cannot be undone.")){ S.entries = []; S.lastId = null; save(); renderPattern(); }
    return;
  }
});

document.addEventListener("input", e => {
  if(e.target.id !== "box") return;
  S.draft = e.target.value;
  save();
  const btn = el("go");
  if(btn) btn.disabled = words(S.draft).length < 3;
});
/* Cmd/Ctrl+Enter submits, because typing on a phone keyboard is enough work. */
document.addEventListener("keydown", e => {
  if(e.target.id === "box" && (e.metaKey || e.ctrlKey) && e.key === "Enter") identify();
});

(function boot(){
  if(!VIEWS.includes(S.view)) S.view = "type";
  if(S.view === "result" && !S.entries.some(x => x.key === S.lastId)) S.view = "type";
  if(S.view === "read" && !S.openId) S.view = "type";
  if(!S.seenAbout && !S.entries.length){ S.view = "about"; S.seenAbout = true; save(); }
  go(S.view);
  const secure = location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1";
  if("serviceWorker" in navigator && secure) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
