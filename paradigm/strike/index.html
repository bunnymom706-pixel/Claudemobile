<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0D12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Strike">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<title>Strike</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* ── Tokens ──────────────────────────────────────────────────────────────
   Dark-first, one ember. Light is designed, not inverted. Everything in
   this app expires at midnight, and the design says so: no history, no
   grids, no day counters — the date in the corner is the whole calendar. */
:root{
  --ground:#0B0D12; --card:#151926; --raised:#1C2233; --sunk:#070910;
  --line:#252B3D; --line-soft:#1B2030;
  --ink:#F2F4F8; --dim:#98A0B3; --faint:#5F6678;
  --ember-a:#FF7A4D; --ember-b:#FF4D7D; --ember:#FF6247;
  --ember-wash:rgba(255,98,71,.12); --ember-line:rgba(255,98,71,.4);
  --mint:#3EE6A8; --mint-wash:rgba(62,230,168,.1);
  --on-ember:#1A0B08;
  --shadow:0 8px 30px rgba(0,0,0,.45);
  --glow:0 0 24px rgba(255,98,71,.25);
  --ui:"Outfit",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --spring:cubic-bezier(.34,1.4,.5,1);
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --ground:#F7F6F3; --card:#FFFFFF; --raised:#FFFFFF; --sunk:#EDECE7;
    --line:#E2E0D8; --line-soft:#ECEAE3;
    --ink:#191C24; --dim:#5B6170; --faint:#9BA0AD;
    --ember-a:#F5603A; --ember-b:#E8386B; --ember:#EA4E38;
    --ember-wash:rgba(234,78,56,.09); --ember-line:rgba(234,78,56,.35);
    --mint:#0FA671; --mint-wash:rgba(15,166,113,.1);
    --on-ember:#FFFFFF;
    --shadow:0 6px 24px rgba(25,28,36,.08);
    --glow:0 0 24px rgba(234,78,56,.18);
  }
}
:root[data-theme="light"]{
  --ground:#F7F6F3; --card:#FFFFFF; --raised:#FFFFFF; --sunk:#EDECE7;
  --line:#E2E0D8; --line-soft:#ECEAE3;
  --ink:#191C24; --dim:#5B6170; --faint:#9BA0AD;
  --ember-a:#F5603A; --ember-b:#E8386B; --ember:#EA4E38;
  --ember-wash:rgba(234,78,56,.09); --ember-line:rgba(234,78,56,.35);
  --mint:#0FA671; --mint-wash:rgba(15,166,113,.1);
  --on-ember:#FFFFFF;
  --shadow:0 6px 24px rgba(25,28,36,.08);
  --glow:0 0 24px rgba(234,78,56,.18);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--ui);
  font-size:16.5px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(2rem + env(safe-area-inset-bottom))}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ember);outline-offset:3px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wrap{max-width:26.5rem;margin:0 auto;padding:0 1.2rem}
.top{display:flex;align-items:center;justify-content:space-between;padding:1.4rem 0 .5rem}
.top .brand{font-weight:800;font-size:1.02rem}
.top .brand i{font-style:normal;background:linear-gradient(90deg,var(--ember-a),var(--ember-b));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.top .date{font-family:var(--mono);font-size:.7rem;color:var(--faint);letter-spacing:.05em}

h1.hero{font-weight:800;font-size:1.8rem;line-height:1.12;letter-spacing:-.025em;
  margin:.5rem 0 .5rem;text-wrap:balance}
p.sub{color:var(--dim);margin:0 0 1.2rem;font-size:.95rem;line-height:1.55}
.lbl{font-family:var(--mono);font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);margin:0 0 .45rem;font-weight:600}
p.tiny{color:var(--faint);font-size:.8rem;line-height:1.5;margin:.55rem 0 0}

.card{background:var(--card);border:1px solid var(--line-soft);border-radius:20px;
  box-shadow:var(--shadow);padding:1.25rem 1.3rem;margin-bottom:.9rem}
.card.flat{box-shadow:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;width:100%;
  border-radius:16px;padding:1rem 1.2rem;cursor:pointer;font-weight:700;font-size:1rem;
  background:var(--raised);color:var(--ink);border:1px solid var(--line);
  transition:transform .12s var(--spring),filter .15s ease}
.btn:active{transform:scale(.975)}
.btn.ember{background:linear-gradient(100deg,var(--ember-a),var(--ember-b));
  border:0;color:var(--on-ember);box-shadow:var(--glow)}
.btn.ember:hover{filter:brightness(1.06)}
.btn.big{padding:1.25rem;font-size:1.12rem;border-radius:20px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--dim);font-weight:500;
  padding:.6rem;width:auto}
.btn.ghost:hover{color:var(--ink)}
.btn.sm{width:auto;padding:.55rem .9rem;font-size:.82rem;border-radius:12px;font-weight:600}
.btn[disabled]{opacity:.35;cursor:not-allowed}

textarea,input[type=text]{width:100%;background:var(--sunk);border:1px solid var(--line);
  border-radius:14px;padding:.85rem 1rem;font-size:1rem;line-height:1.5}
textarea{resize:vertical;min-height:4.6rem}
input::placeholder,textarea::placeholder{color:var(--faint)}
textarea:focus,input:focus{border-color:var(--ember)}

.stmt{font-weight:700;font-size:1.34rem;line-height:1.28;letter-spacing:-.015em;
  text-wrap:balance;margin:0}
.stmt-tag{font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ember);display:block;margin-bottom:.5rem;font-weight:600}

.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{background:var(--raised);border:1px solid var(--line);border-radius:100px;
  padding:.5rem .9rem;font-size:.87rem;cursor:pointer;color:var(--dim);font-weight:500;text-align:left}
.chip:hover{border-color:var(--ember);color:var(--ink)}
.chip.on{background:var(--ember-wash);border-color:var(--ember);color:var(--ink)}

.tally{display:flex;gap:.6rem;margin:0 0 .9rem}
.pill{flex:1;background:var(--card);border:1px solid var(--line-soft);border-radius:16px;
  padding:.7rem .4rem;text-align:center}
.pill .v{font-weight:800;font-size:1.3rem;font-variant-numeric:tabular-nums;line-height:1.1}
.pill.hot .v{background:linear-gradient(90deg,var(--ember-a),var(--ember-b));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.pill .k{font-family:var(--mono);font-size:.56rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);margin-top:.15rem}

.moverow{display:flex;align-items:center;gap:.8rem;padding:.65rem 0;border-bottom:1px solid var(--line-soft)}
.moverow:last-child{border-bottom:0}
.tick{flex:0 0 28px;width:28px;height:28px;border-radius:10px;background:var(--sunk);
  border:1.5px solid var(--line);cursor:pointer;display:grid;place-items:center;padding:0;
  transition:all .18s var(--spring)}
.tick svg{width:15px;height:15px;stroke:var(--mint);stroke-width:2.6;fill:none;opacity:0;
  stroke-linecap:round;stroke-linejoin:round}
.tick.on{background:var(--mint-wash);border-color:var(--mint)}
.tick.on svg{opacity:1}
.moverow .txt{flex:1;font-size:.93rem;line-height:1.35}
.moverow .txt.off{color:var(--faint);text-decoration:line-through}
.moverow .at{font-family:var(--mono);font-size:.62rem;color:var(--faint)}

/* ── Moment overlay ────────────────────────────────────────────────────── */
.sheet{position:fixed;inset:0;background:var(--ground);z-index:50;display:none;
  overflow-y:auto;padding:1.3rem;padding-bottom:calc(1.3rem + env(safe-area-inset-bottom))}
.sheet.on{display:flex;animation:in .28s var(--spring)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sheet-inner{max-width:26.5rem;margin:auto;width:100%;display:flex;flex-direction:column;gap:1.05rem}
.spread{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.angle{font-weight:800;font-size:2.05rem;letter-spacing:-.03em;line-height:1;margin:0;
  background:linear-gradient(90deg,var(--ember-a),var(--ember-b));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.breath{display:grid;place-items:center;height:190px;position:relative}
.breath .disc{width:64px;height:64px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,var(--ember-a),var(--ember-b));
  box-shadow:var(--glow);transition:transform 1s linear}
.breath .cue{position:absolute;bottom:2px;left:0;right:0;text-align:center;
  font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ember)}
.hidden{display:none!important}
</style>
</head>
<body>

<!-- ══ THE MOMENT — under 60 seconds, then back out ═════════════════════ -->
<div class="sheet" id="moment" role="dialog" aria-modal="true">
  <div class="sheet-inner">
    <div class="spread">
      <span class="lbl" id="m-step" style="margin:0">This moment</span>
      <button class="btn ghost sm" id="m-quit" type="button">Leave</button>
    </div>
    <div id="m-body"></div>
  </div>
</div>

<div class="wrap">
  <div class="top">
    <span class="brand">Str<i>ike</i></span>
    <span class="date" id="datelabel"></span>
  </div>
  <div id="body"></div>
</div>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════
   STRIKE — today and this moment. Nothing else.

   One line runs the day. One button shifts the moment. At midnight the
   board wipes itself: no streaks, no day counts, no month view, nothing
   to fall behind on. Yesterday survives only as a suggestion.

   The moment protocol is Proctor compressed to its live edge: name what
   has you (awareness of the vibration IS the first move), breathe through
   neutral (cyclic sighing — you don't jump negative to positive), read
   today's line once out loud, then name the next five minutes. The move
   is the shift; everything before it is how you get to the move.
   ═══════════════════════════════════════════════════════════════════════ */

const KEY = "strike.v2";
const clone = o => JSON.parse(JSON.stringify(o));
const BLANK = { v:2, line:null, lineOn:null, saved:[], today:{ on:null, shifts:0, moves:[] } };
let S = load();

function todayKey(){ const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function load(){
  let s;
  try{ s = Object.assign(clone(BLANK), JSON.parse(localStorage.getItem(KEY) || "null") || {}); }
  catch(e){ s = clone(BLANK); }
  /* Midnight wipe: today's board resets; the line expires into a suggestion. */
  if(s.today.on !== todayKey()){
    s.today = { on:todayKey(), shifts:0, moves:[] };
    try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(e){}
  }
  return s;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function el(id){ return document.getElementById(id); }
function words(s){ return String(s||"").trim().split(/\s+/).filter(Boolean); }
function nowTime(){ return new Date().toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}); }
function lineIsToday(){ return !!S.line && S.lineOn === todayKey(); }

const STARTERS = [
  "Today, money comes to me easily and I let it.",
  "Today I ask directly, and the silence doesn't scare me.",
  "Today I send it before it's perfect.",
  "Today, being seen works for me.",
  "Today I keep what goes well.",
  "Today, easy counts."
];
const GRIPS = [
  "About to drop my price","Avoiding a message","They went quiet","Just got a no",
  "Spinning, doing nothing","Going well — waiting for the drop","Scared to post","Tired of all of it"
];

/* ── Home ──────────────────────────────────────────────────────────────── */
function fmtDate(){
  return new Date().toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
}
function render(){
  el("datelabel").textContent = fmtDate();
  const t = S.today;

  if(!lineIsToday()){
    const yesterday = S.line;
    el("body").innerHTML = `
      <h1 class="hero">What's today's paradigm?</h1>
      <p class="sub">One line, for one day. Not a life sentence — you run it today, and at midnight it expires. Tomorrow you choose again.</p>
      ${yesterday ? `<div class="card"><span class="stmt-tag">Yesterday you ran</span>
        <p class="stmt" style="font-size:1.1rem">${esc(yesterday)}</p>
        <button class="btn sm ember" data-act="keep" style="margin-top:.9rem" type="button">Run it again today</button></div>` : ""}
      <div class="card flat">
        <textarea id="line-in" rows="2" placeholder="Today, …"></textarea>
        <p class="tiny" id="line-hint">Present tense, as a fact about today. If saying it makes you feel something, it's right.</p>
        <button class="btn ember" id="line-set" data-act="set-line" style="margin-top:.8rem" type="button" disabled>Run today on this</button>
      </div>
      ${S.saved.length ? `<p class="lbl" style="margin-top:1rem">Lines that have worked</p>
        <div class="chips">${S.saved.map((x,i)=>`<button type="button" class="chip" data-pick="${i}">${esc(x.length>52?x.slice(0,52)+"…":x)}</button>`).join("")}</div>` : ""}
      <p class="lbl" style="margin-top:1.1rem">Or start from one</p>
      <div class="chips">${STARTERS.map((x,i)=>`<button type="button" class="chip" data-starter="${i}">${esc(x)}</button>`).join("")}</div>`;
    return;
  }

  el("body").innerHTML = `
    <div class="card">
      <span class="stmt-tag">Today's paradigm</span>
      <p class="stmt">${esc(S.line)}</p>
      <div style="display:flex;gap:.2rem;margin-top:.8rem">
        <button class="btn ghost sm" data-act="change" type="button">Change it</button>
        <button class="btn ghost sm" data-act="save-line" type="button">${S.saved.includes(S.line) ? "Saved" : "Save this line"}</button>
      </div>
    </div>
    <button class="btn ember big" data-act="moment" type="button">Shift this moment</button>
    <p class="tiny" style="text-align:center;margin:.5rem 0 1rem">Under a minute. Use it the second something has you — not an hour later.</p>
    <div class="tally">
      <div class="pill hot"><div class="v">${t.shifts}</div><div class="k">shifts today</div></div>
      <div class="pill"><div class="v">${t.moves.length}</div><div class="k">moves named</div></div>
      <div class="pill"><div class="v">${t.moves.filter(m=>m.done).length}</div><div class="k">moves made</div></div>
    </div>
    ${t.moves.length ? `<div class="card flat">
      <p class="lbl">The next-five-minutes list — dies at midnight</p>
      ${t.moves.map((m,i)=>`<div class="moverow">
        <button class="tick${m.done?" on":""}" data-tickmove="${i}" aria-label="Move done" type="button"><svg viewBox="0 0 24 24"><path d="M4 12l6 6L20 6"/></svg></button>
        <span class="txt${m.done?" off":""}">${esc(m.text)}</span>
        <span class="at">${esc(m.at)}</span></div>`).join("")}
      <p class="tiny">The move is the shift. Everything in the overlay was just how you got to it.</p>
    </div>` : `<div class="card flat"><p class="tiny" style="margin:0">Nothing named yet today. The first time something grabs you — the price flinch, the unsent message — hit the button.</p></div>`}`;
}

/* line composer */
function lineHint(v){
  const lower = " " + v.toLowerCase() + " ";
  if(/\b(will|going to|want to|hope|wish|try|trying|someday)\b/.test(lower))
    return "That reads as future — it files today under later. Say it as already true today.";
  if(/\b(not|never|don't|dont|stop|quit|won't|wont)\b/.test(lower))
    return "A negative runs the picture you named. Say what today is, not what it isn't.";
  return "Present tense, as a fact about today. If saying it makes you feel something, it's right.";
}

/* ── The moment: grip → neutral → line → move ──────────────────────────── */
let M = null, breathT = null;
function openMoment(){ M = { step:0, d:{} }; el("moment").classList.add("on"); renderMoment(); }
function closeMoment(){
  if(breathT){ clearTimeout(breathT); breathT = null; }
  M = null; el("moment").classList.remove("on"); render();
}
function renderMoment(){
  const d = M.d;
  if(M.step === 0){
    el("m-step").textContent = "This moment · 1 of 3";
    el("m-body").innerHTML = `
      <h2 class="angle">What's got you?</h2>
      <p class="sub">Naming it is not a warm-up. The feeling is your awareness of the vibration you're in, and naming it is what starts moving it.</p>
      <div class="chips">${GRIPS.map(g=>`<button type="button" class="chip${d.grip===g?" on":""}" data-grip="${esc(g)}">${esc(g)}</button>`).join("")}</div>
      <input type="text" id="m-grip" placeholder="…or say it your way" value="${esc(d.gripFree||"")}" style="margin-top:.7rem">
      <button class="btn ember" id="m-next" type="button" ${d.grip||words(d.gripFree).length?"":"disabled"}>Got it — breathe</button>`;
    el("m-grip").oninput = e => { d.gripFree = e.target.value;
      el("m-next").disabled = !(d.grip || words(d.gripFree).length); };
    el("m-next").onclick = () => { M.step = 1; renderMoment(); };
    return;
  }
  if(M.step === 1){
    el("m-step").textContent = "This moment · 2 of 3";
    el("m-body").innerHTML = `
      <h2 class="angle">Through neutral.</h2>
      <p class="sub">You don't jump from ${esc((d.grip||d.gripFree||"that").toLowerCase())} to good. Three rounds: in through the nose, top it up, long exhale out the mouth.</p>
      <div class="breath"><div class="disc" id="m-disc"></div><div class="cue" id="m-cue">In through the nose</div></div>
      <button class="btn ember" id="m-next" type="button" disabled>Neutral</button>
      <button class="btn ghost" id="m-skip" style="width:100%" type="button">Skip the breathing</button>`;
    runBreath();
    el("m-next").onclick = () => { stopBreath(); M.step = 2; renderMoment(); };
    el("m-skip").onclick = () => { stopBreath(); M.step = 2; renderMoment(); };
    return;
  }
  el("m-step").textContent = "This moment · 3 of 3";
  el("m-body").innerHTML = `
    <h2 class="angle" style="font-size:1.6rem">Say it once. Out loud.</h2>
    <div class="card"><span class="stmt-tag">Today's paradigm</span>
      <p class="stmt">${esc(S.line)}</p></div>
    <p class="lbl" style="margin-top:.3rem">Now — the next five minutes</p>
    <input type="text" id="m-move" placeholder="Send it. Call them. Say the number." value="${esc(d.move||"")}">
    <button class="btn ember" id="m-go" type="button" disabled>Go — the move is the shift</button>
    <p class="tiny" style="text-align:center">Not the day's plan. Five minutes. One physical thing.</p>`;
  const inp = el("m-move");
  inp.oninput = () => { d.move = inp.value; el("m-go").disabled = words(d.move).length < 2; };
  el("m-go").onclick = () => {
    S.today.shifts++;
    S.today.moves.push({ text:d.move.trim(), at:nowTime(), done:false });
    save(); closeMoment();
  };
  setTimeout(() => inp.focus(), 100);
}
function runBreath(){
  const seq = [
    { t:2400, s:1.85, txt:"In through the nose" },
    { t:1100, s:2.3, txt:"Top it up" },
    { t:5200, s:1.0, txt:"Long exhale out the mouth" }
  ];
  let round = 0, i = 0;
  const disc = el("m-disc"), cue = el("m-cue");
  const tick = () => {
    if(round >= 3){
      cue.textContent = "Neutral.";
      disc.style.transform = "scale(1)";
      const b = el("m-next"); if(b) b.disabled = false;
      breathT = null; return;
    }
    if(!disc.isConnected){ breathT = null; return; }
    const s = seq[i];
    disc.style.transitionDuration = (s.t/1000)+"s";
    disc.style.transform = "scale("+s.s+")";
    cue.textContent = s.txt;
    breathT = setTimeout(() => { i++; if(i >= seq.length){ i = 0; round++; } tick(); }, s.t);
  };
  tick();
}
function stopBreath(){ if(breathT){ clearTimeout(breathT); breathT = null; } }

/* ── Events ────────────────────────────────────────────────────────────── */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act],[data-starter],[data-pick],[data-grip],[data-tickmove]");
  if(!t) return;

  if(t.dataset.grip !== undefined && M){
    M.d.grip = M.d.grip === t.dataset.grip ? "" : t.dataset.grip;
    renderMoment(); return;
  }
  if(t.dataset.starter !== undefined){
    const v = STARTERS[+t.dataset.starter];
    const box = el("line-in");
    if(box){ box.value = v; box.dispatchEvent(new Event("input")); box.focus(); }
    return;
  }
  if(t.dataset.pick !== undefined){
    const v = S.saved[+t.dataset.pick];
    const box = el("line-in");
    if(box){ box.value = v; box.dispatchEvent(new Event("input")); box.focus(); }
    return;
  }
  if(t.dataset.tickmove !== undefined){
    const m = S.today.moves[+t.dataset.tickmove];
    if(m){ m.done = !m.done; save(); render(); }
    return;
  }

  const a = t.dataset.act;
  if(a === "set-line"){
    const v = el("line-in").value.trim();
    if(words(v).length < 4) return;
    S.line = v; S.lineOn = todayKey(); save(); render(); return;
  }
  if(a === "keep"){ S.lineOn = todayKey(); save(); render(); return; }
  if(a === "change"){ S.lineOn = null; save(); render(); return; }
  if(a === "save-line"){
    if(!S.saved.includes(S.line)){ S.saved.unshift(S.line); S.saved = S.saved.slice(0,12); save(); render(); }
    return;
  }
  if(a === "moment"){ openMoment(); return; }
});
document.addEventListener("input", e => {
  if(e.target.id !== "line-in") return;
  const v = e.target.value;
  const hint = el("line-hint"), btn = el("line-set");
  if(hint) hint.textContent = lineHint(v);
  if(btn) btn.disabled = words(v).length < 4;
});
el("m-quit").addEventListener("click", closeMoment);
document.addEventListener("keydown", e => {
  if(e.key === "Escape" && el("moment").classList.contains("on")) closeMoment();
});
/* If the app sits open across midnight, the next touch of visibility
   re-runs the wipe. */
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible" && S.today.on !== todayKey()){
    S = load(); render();
  }
});

/* ── Boot ──────────────────────────────────────────────────────────────── */
render();
const secure = location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1";
if("serviceWorker" in navigator && secure) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
