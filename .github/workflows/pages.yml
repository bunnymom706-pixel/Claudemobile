name: Deploy paradigm app to Pages

on:
  push:
    branches: [main]
    paths: ['paradigm/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload the app directory
        uses: actions/upload-pages-artifact@v3
        with:
          path: paradigm
      - id: deploy
        uses: actions/deploy-pages@v4
